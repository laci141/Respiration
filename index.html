},
map:[
{name:"Die Nase",phase:"Einatmung",tag:"Filter, Heizung, Befeuchter – und eine Gasfabrik",
 short:"Die Luft wird gefiltert, auf Körpertemperatur erwärmt und mit Feuchtigkeit gesättigt.",
 cap:"Längsschnitt des Kopfes von der Seite. Die Luft tritt links ein, die drei Nasenmuscheln zwingen sie in Wirbel, dann geht es nach unten Richtung Rachen.",
 what:"Aus der Wand der Nasenhöhle ragen drei knöcherne Regale, die Nasenmuscheln – in der Zeichnung die drei nach oben eingerollten Zungen. Sie zwingen die Luft in Wirbel, sodass sie eine viel größere Fläche der feuchten, gut durchbluteten Schleimhaut berührt. Innerhalb weniger Zentimeter erwärmt sich die eingeatmete Luft auf Körpertemperatur, bis zu den Hauptbronchien wird sie praktisch mit Wasserdampf gesättigt, und die größeren Partikel bleiben in der Schleimschicht hängen. Atmest du durch den Mund, entfällt diese ganze Vorbereitung, und die Last der trockeneren Luft trägt die Schleimhaut der Luftröhre.",
 sci:"Die Nasennebenhöhlen – in der Zeichnung die drei Hohlräume in Stirn, Wangenknochen und tief im Schädel – produzieren laufend Stickstoffmonoxid (NO), das beim Einatmen in die Lunge getragen wird. NO erweitert Gefäße und Bronchien, verbessert die Abstimmung von Belüftung und Durchblutung und wirkt auch gegen Viren und Bakterien. Messungen zeigen: Bei Nasenatmung ist der an der Haut gemessene Sauerstoffdruck rund 10 % höher als bei Mundatmung.",
 tie:"Deshalb beginnt fast jede Technik mit dem Einatmen durch die Nase. Das Bienensummen gehört gesondert hierher: Die Vibration des Summens erhöht die aus den Nebenhöhlen strömende NO-Menge um ein Vielfaches.",
 sl:["so warm wird die Luft","Feuchte an den Hauptbronchien","der Feuchte kommt aus der Nase"],exs:["nadi","bhramari"],
 d:["Nasenmuscheln (3)","Staub und Pollen bleiben hängen","Nebenhöhlen","Richtung Rachen","Schleimhaut","Luft"]},
{name:"Kehlkopf und Luftröhre",phase:"Einatmung",tag:"Hufeisenförmige Knorpelringe und eine Schleim-Rolltreppe",
 short:"Eine etwa 11 cm lange Röhre, von Knorpelringen offen gehalten, die sich innen selbst reinigt.",
 cap:"Links die Luftröhre von vorn mit den Knorpelringen und der Gabelung; rechts die Wand vergrößert: Schleimschicht, Flimmerhärchen, Becherzellen.",
 what:"Nach dem Kehlkopf gelangt die Luft in die Luftröhre: eine etwa 10–12 cm lange Röhre, die von hinten offenen, hufeisenförmigen Knorpelringen gespannt wird. Sie sind gerade deshalb keine vollen Kreise, damit sich die dahinter verlaufende Speiseröhre beim Schlucken weiten kann. Unten, an der Carina, teilt sie sich in zwei Hauptbronchien; die rechte ist dicker und steiler, deshalb landet dort öfter ein verschluckter Fremdkörper. Das Innere ist mit Flimmerepithel ausgekleidet: Millionen mikroskopischer Härchen schieben eine dünne Schleimschicht nach oben Richtung Rachen. Im vergrößerten Ausschnitt bilden die Becherzellen zwischen den Härchen den Schleim selbst.",
 sci:"Die Flimmerhärchen schlagen koordiniert in Wellen, und ihre Bewegung wird unter anderem auch von dem in der Nase gebildeten Stickstoffmonoxid gesteuert. Ist die Luft zu trocken – etwa bei Mundatmung –, dickt der Schleim ein und die Rolltreppe wird langsamer. Zigarettenrauch verschlechtert diesen Reinigungsmechanismus nachweislich.",
 tie:"Ujjayi (die Ozeanatmung) verengt genau hier, am Kehlkopf, den Spalt ein wenig – das entstehende leise Rauschen ist hörbare Rückmeldung darüber, wie gleichmäßig dein Luftstrom ist.",
 sl:["Länge der Luftröhre","hufeisenförmige Knorpelringe","hier beginnt die Zählung der Atemwege"],exs:["ujjayi"],
 d:["Flimmerhärchen","Schleimschicht","Becherzellen","der Schmutz wandert nach oben","Kehlkopf","Luftröhre","linker Hauptbronchus","rechter Hauptbronchus","Speiseröhre","Carina"]},
{name:"Bronchien und Bronchiolen",phase:"Einatmung",tag:"23 Verzweigungen, ein auf den Kopf gestellter Baum",
 short:"Die Röhre teilt sich in zwei, dann wieder und wieder – insgesamt etwa 23 Generationen.",
 cap:"Die Umrisse beider Lungenflügel mit den Lappen, darin der Bronchialbaum. Rechts 3, links 2 Lappen – links muss auch das Herz Platz haben.",
 what:"Die Luftröhre teilt sich in zwei Hauptbronchien, dann teilt sich jeder Ast wieder in zwei. Der durchschnittliche Weg von der Luftröhre bis zum Lungenrand bedeutet etwa 23 solcher Verzweigungen, in Wirklichkeit ist das aber nicht regelmäßig: Auch in der Zeichnung sieht man, dass die Äste unterschiedlich lang und dick sind – das nennt man unregelmäßige Zweiteilung. Die ersten 16 Generationen transportieren nur, hier gibt es noch keinen Gasaustausch. Ab der 17. Verzweigung erscheinen in der Wand die ersten Lungenbläschen, und von da an strömt die Luft bei jedem Schritt langsamer, bis die Bewegung schließlich die reine Diffusion übernimmt.",
 sci:"Bei jeder Teilung wächst der Gesamtquerschnitt der Äste, sodass die Geschwindigkeit der Luft dramatisch sinkt. Die kleinsten Bronchiolen haben kein Knorpelgerüst mehr, nur einen Ring aus glatter Muskulatur – diese verkrampfen sich beim Asthmaanfall. Das Volumen der Leitungszone ist der Totraum: etwa 150 ml, die bei jedem Atemzug für den Gasaustausch verloren gehen.",
 tie:"Deshalb ist ein langsamer, tiefer Atemzug wirksamer als zwei hastige: Der Totraum bleibt gleich, aber bei einem größeren Atemzug geht anteilig viel weniger davon verloren.",
 sl:["Verzweigungsgenerationen","transportiert nur (Leitungszone)","tauscht bereits Gas aus"],exs:["belly","koherens"],
 d:["Luftröhre","Hauptbronchien","Lappenbronchien","hier beginnt der Gasaustausch","rechte Lunge · 3 Lappen","linke Lunge · 2 Lappen","Platz des Herzens"]},
{name:"Die Lungenbläschen",phase:"Gasaustausch",tag:"Ein halber Tennisplatz, gefaltet in deinem Brustkorb",
 short:"Mehrere hundert Millionen winzige Bläschen, umsponnen von einem dichten Kapillarnetz.",
 cap:"Links ein Alveolarsack mit dem Kapillarnetz und den darin wandernden roten Blutkörperchen. Rechts der Querschnitt der Wand, Schicht für Schicht.",
 what:"Die letzten Äste enden in Trauben: Das sind die Lungenbläschen, die Alveolen. In der Zeichnung sind sie absichtlich vieleckig, denn in Wirklichkeit sind sie keine Kugeln – eng aneinandergepresst teilen sie sich wabenartige Wände. Jedes ist nur ein Fünftelmillimeter groß, und es gibt mehrere hundert Millionen davon. Ausgebreitet würde ihre Fläche einen halben Tennisplatz bedecken. Jedes wird von einem dichten Kapillarnetz umsponnen, in dem die roten Blutkörperchen im Gänsemarsch wandern. Der Querschnitt rechts zeigt, wie dünn die Trennwand ist: von der Luft her ein Fettfilm, eine flache Epithelzelle, eine gemeinsame Basalmembran, eine Gefäßwandzelle – und schon bist du im Blut.",
 sci:"Das Innere der Bläschen ist von einer oberflächenaktiven Substanz überzogen, dem Surfactant – er verhindert, dass die winzigen Bläschen beim Ausatmen verkleben. Beim Lungenemphysem zerfallen die Wände und die Bläschen verschmelzen zu weniger, größeren Hohlräumen: Die Fläche sinkt drastisch. Bei der Lungenfibrose umgekehrt verdickt sich die Wand, und der Übertritt der Gase wird langsamer.",
 tie:"Das tiefe Einatmen in den Bauch öffnet auch die unteren Lungenlappen – dort ist das Kapillarnetz am dichtesten, dort ist der Gasaustausch also am wirksamsten. Die flache Brustatmung lässt diesen Bereich weitgehend aus.",
 sl:["Lungenbläschen insgesamt","Austauschfläche","die Luft-Blut-Wand"],exs:["belly","koherens"],
 d:["Luft","Surfactant-Film","Epithelzelle","Basalmembran","Gefäßwandzelle","Blut + rotes Blutkörperchen","0,5–1 µm die ganze Wand","Bronchiole","Lungenbläschen","Kapillarnetz","das Blut ist 0,75 s hier – der Austausch dauert 0,25 s"]},
{name:"Der Gasaustausch selbst",phase:"Gasaustausch",tag:"Keine Pumpe – nur Druckunterschied",
 short:"Sauerstoff und Kohlendioxid wandern von selbst, vom höheren zum niedrigeren Druck.",
 cap:"Die beiden Seiten der Trennwand. O₂ (zwei verbundene Kugeln) wandert von links nach rechts, CO₂ (drei Kugeln) von rechts nach links, jedes auf seinem eigenen Druckgefälle.",
 what:"Hier gibt es keine Pumpe und keinen aktiven Transport: Jedes Gas geht von dort, wo sein eigener Druck höher ist, dorthin, wo er niedriger ist. Im Lungenbläschen beträgt der Sauerstoffdruck etwa 100 mmHg, im ankommenden Blut nur 40 – dieser Unterschied von sechzig treibt den Sauerstoff hinein, wo ihn im roten Blutkörperchen sofort das Hämoglobin aufnimmt. Beim Kohlendioxid beträgt der Unterschied nur 5 mmHg, dafür löst sich CO₂ etwa zwanzigmal schneller und passiert die Wand entsprechend rascher, sodass auch dieses kleine Gefälle reichlich genügt.",
 sci:"In Ruhe verbringt das rote Blutkörperchen etwa 0,75 Sekunden in der Kapillare, der Ausgleich geschieht aber schon nach einem Drittel des Weges – es gibt also eine dreifache Sicherheitsreserve. Deshalb ist nicht die Diffusion, sondern die Durchblutung der Engpass: Das nennt man perfusionslimitierten Austausch.",
 tie:"Daran sieht man, warum hastiges Atmen nichts löst: Das Blut wird ohnehin gesättigt. Was die langsame Atmung verbessert, ist die bessere Abstimmung von Belüftung und Durchblutung in der ganzen Lunge.",
 sl:["O₂-Druckgefälle, mmHg","CO₂-Druckgefälle, mmHg","bis zum Ausgleich"],exs:["koherens","box"],
 d:["LUNGENBLÄSCHEN","KAPILLARE","Wand","das Hämoglobin nimmt ihn auf","in die ausgeatmete Luft"]},
{name:"Blut und Hämoglobin",phase:"O₂-Transport",tag:"Vier Eisenatome, vier Sitzplätze für den Sauerstoff",
 short:"Sauerstoff löst sich schlecht im Blut – deshalb steigt er in ein Taxi, das Hämoglobin.",
 cap:"Links die Scheibenform des roten Blutkörperchens mit der eingezogenen Mitte, darin die vier Untereinheiten des Hämoglobins. Rechts die Sättigungskurve: Die S-Form ist das Zeichen der kooperativen Bindung.",
 what:"Sauerstoff löst sich schlecht in Wasser, im Blutplasma passt also kaum etwas davon hinein. Die Lösung ist das Hämoglobin: ein Protein aus vier Untereinheiten im Inneren der roten Blutkörperchen – zwei Alpha- und zwei Beta-Ketten –, jede mit einer flachen Häm-Scheibe in der Mitte, in deren Herz ein Eisenatom sitzt. Ein Eisen bindet ein Sauerstoffmolekül, ein Hämoglobin transportiert also vier. 98,5 % des transportierten Sauerstoffs reisen so, nur 1,5 % lösen sich frei im Plasma. Das rote Blutkörperchen hat gerade deshalb keinen Zellkern und ist in der Mitte flach, damit möglichst viel Hämoglobin hineinpasst.",
 sci:"Die Bindung ist nicht gleichmäßig: Sobald der erste Sauerstoff bindet, ändert das Protein seine Form und nimmt den zweiten und dritten leichter auf. Das ist die kooperative Bindung, und daher die S-Form der Sättigungskurve rechts. Der obere, flache Teil ist die Lunge: Hier senkt selbst ein großer Druckabfall die Sättigung kaum. Der steile mittlere Teil ist das Gewebe: Hier löst schon ein kleiner Druckabfall die Abgabe von sehr viel Sauerstoff aus. In saurerer, wärmerer, CO₂-reicherer Umgebung verschiebt sich die Kurve nach rechts – das ist der Bohr-Effekt.",
 tie:"Das erklärt, warum Überatmen nichts bringt: Der obere Teil der Kurve ist flach, dein Blut liegt in Ruhe schon bei 97–99 %. Was sich bei schneller Atmung wirklich ändert, ist der Kohlendioxidspiegel.",
 sl:["O₂ an einem Hämoglobin","an Hämoglobin gebunden","bis die Zelle gesättigt ist"],exs:["wimhof","koherens"],
 d:["O₂-Molekül","Häm + Eisenatom","rotes Blutkörperchen · 4 Plätze","Sättigung","Gewebe","Lunge","O₂-Druck →","steiler Teil:","hier gibt es O₂ ab"]},
{name:"Herz und Arterien",phase:"O₂-Transport",tag:"Die linke Herzhälfte: die Hochdruckpumpe",
 short:"Das aus der Lunge zurückkehrende, sauerstoffreiche Blut startet über die linke Herzhälfte in den Körper.",
 cap:"Die vier Herzkammern im Schnitt. Violett die CO₂-reiche, rosa die sauerstoffreiche Seite; die kurzen Linien sind die Klappen.",
 what:"Das frisch mit Sauerstoff beladene Blut kommt über die Lungenvenen im linken Vorhof an, von dort über die Klappe in die linke Kammer, die stärkste Muskelpumpe des Körpers – in der Zeichnung sieht man gut, dass ihre Wand deutlich dicker ist als die der rechten Seite. Von hier geht es in die Aorta, dann über immer kleinere Arterien bis zu den Kapillaren. Die rechte Seite bewegt genauso viel Blut, aber nur bis zur Lunge, mit viel geringerem Druck. In Ruhe bewegt das Herz etwa fünf Liter Blut pro Minute, und der ganze Rundweg eines roten Blutkörperchens dauert weniger als eine Minute.",
 sci:"Lungen- und Körperkreislauf sind in Reihe geschaltet, deshalb bewegen beide Herzhälften gleich viel Blut, nur bei sehr unterschiedlichem Druck. Beim Einatmen saugt der sinkende Druck im Brustkorb mehr Blut zum Herzen zurück – deshalb beschleunigt sich dein Puls beim Einatmen und verlangsamt sich beim Ausatmen.",
 tie:"Dieses Wellen des Pulses ist die respiratorische Sinusarrhythmie, die Grundlage der Herzratenvariabilität. Deshalb ist die Wirkung langsamer Atmung direkt am Herzen messbar.",
 sl:["Herzminutenvolumen in Ruhe","ein ganzer Rundweg","arterieller O₂-Druck"],exs:["koherens","box"],
 d:["rechts","links","Vorhof","obere Hohlvene","untere Hohlvene","Lungenarterie","AORTA","Lungenvenen","Gewebe, Kapillaren","Kammer","~5 l/min","Herzminutenvolumen in Ruhe","die Wand der linken Kammer","ist dreimal dicker"]},
{name:"Die Zelle und das Mitochondrium",phase:"Zelle",tag:"Das Ende des Weges: Hier wird die Luft zu Energie",
 short:"Der Sauerstoff schließt die Energiekette in den Kraftwerken der Zelle ab.",
 cap:"Schnitt durch ein Mitochondrium. Auf den Falten der inneren Membran sitzen die vier Komplexe und die ATP-Synthase; die Protonen werden hinausgepumpt und strömen durch die ATP-Synthase zurück.",
 what:"In den Kapillaren tritt der Sauerstoff aus dem Blut und gelangt in die Zellen, dort in die Mitochondrien. Diese haben zwei Membranen, und die innere ist tief gefaltet – diese Cristae liefern die riesige Arbeitsfläche. Die aus dem Abbau der Glukose stammenden Elektronen laufen durch vier in die Falten eingebettete Proteinkomplexe. Bei jedem Schritt pumpen sie Protonen zwischen die beiden Membranen, wo sich die Ladung staut wie in einem Stausee. Die Protonen strömen dann durch die ATP-Synthase zurück, und dieser Rückstrom treibt die ATP-Herstellung an. Der Sauerstoff tritt beim vierten Komplex ein: Er verbrennt nichts, sondern nimmt die verbrauchten Elektronen auf und wird zu Wasser. Fehlt er, staut sich die ganze Reihe zurück und kommt zum Stillstand.",
 sci:"Die sauerstoffarme, saurere Gewebeumgebung hilft ebenfalls: Das Hämoglobin hält den Sauerstoff hier lockerer und gibt ihn reichlich ab. Das rote Blutkörperchen selbst ist jedoch eine kuriose Ausnahme – es hat keine Mitochondrien, verbraucht also von dem Sauerstoff, den es transportiert, nichts.",
 tie:"Von hier versteht man auch die Wirkung von Tummo und Wim-Hof-Atmung: Du wirst warm wegen des angekurbelten Stoffwechsels und der Adrenalinantwort, nicht weil du mehr Sauerstoff aufgenommen hättest.",
 sl:["ATP aus einer Glukose","das letzte Glied der Kette","Nebenprodukt des Prozesses"],exs:["tummo","wimhof"],
 d:["H⁺ zurück","O₂ + 4H⁺ → H₂O","Citratzyklus","NADH → Komplex I","Glukose","Falten der inneren Membran (Cristae)","äußere","Membran"]},
{name:"Der Rückweg des Kohlendioxids",phase:"CO₂-Rückweg",tag:"Es reist in drei Formen, nicht in einer",
 short:"Der größte Teil des CO₂ geht nicht als Gas, sondern als Bikarbonat zurück.",
 cap:"Das Innere des roten Blutkörperchens: Die Carboanhydrase macht aus CO₂ Kohlensäure, das Bikarbonat wird gegen Chlorid getauscht, und das Wasserstoffion fängt das Hämoglobin ab.",
 what:"Das Kohlendioxid tritt aus den Zellen ins Blut, und der größte Teil diffundiert sofort in die roten Blutkörperchen. Dort verwandelt es ein sehr schnelles Enzym, die Carboanhydrase, mit Wasser in Kohlensäure, die sofort in ein Wasserstoffion und Bikarbonat zerfällt. Das Wasserstoffion fängt das Hämoglobin ab, damit das Blut nicht sauer wird, und das Bikarbonat tritt ins Plasma aus – an seine Stelle tritt über den Austauscher in der Membran ein Chlorid, damit das elektrische Gleichgewicht erhalten bleibt. So reisen etwa 70 % des CO₂ als Bikarbonat, rund 23 % an den Proteinteil des Hämoglobins gebunden, und nur 7 % bleiben frei gelöst. In der Lunge läuft derselbe Vorgang rückwärts ab.",
 sci:"Dieses System ist zugleich der Motor des wichtigsten pH-Puffers des Körpers. Atmest du schnell und tief, atmest du mehr CO₂ aus, als produziert wird: Das Blut wird alkalischer, und es kommt zu Kribbeln, Schwindel, Handkrämpfen. Hältst du dagegen die Luft an, sammelt sich CO₂ an – und den Atemreiz löst in erster Linie genau das aus, nicht der Sauerstoffmangel.",
 tie:"Das ist der Schlüssel zur Box-Atmung wie auch zur 4-7-8: Das Anhalten lässt bewusst etwas CO₂ ansteigen, was den Puls verlangsamt. Der Feueratem und die Wim-Hof-Methode verschieben dasselbe in die entgegengesetzte Richtung.",
 sl:["als Bikarbonat","an Hämoglobin gebunden","als gelöstes Gas"],exs:["box","n478","wimhof"],
 d:["aus dem Gewebe","Carboanhydrase","Hb bindet es","raus","rein","Chloridaustausch","Verteilung des CO₂","an Hb gebunden","gelöstes Gas","in der Lunge läuft das","alles rückwärts ab","Inneres des roten Blutkörperchens"]},
{name:"Zurück in die Lunge",phase:"CO₂-Rückweg",tag:"Die zwei Kreisläufe, die ineinandergreifen",
 short:"Das CO₂-reiche Blut kehrt über die rechte Herzhälfte zu den Lungenbläschen zurück.",
 cap:"Der gesamte Kreislauf in einem Bild. Der kleine Kreis gehört der Lunge, der große dem Körper – die beiden sind im Herzen in Reihe geschaltet.",
 what:"Das kohlendioxidreiche Blut gelangt über die großen Venen in den rechten Vorhof, von dort in die rechte Kammer. Die einzige Arterie im Körper, die sauerstoffarmes Blut führt, ist gerade die Lungenarterie – in der Zeichnung der violette Ast, der vom Herzen zur Lunge zieht. An den Lungenbläschen wird aus dem Bikarbonat wieder CO₂, es tritt in die Luft aus, das Hämoglobin lädt sich neu mit Sauerstoff und kehrt über die rosa Lungenvenen zur linken Herzhälfte zurück. Von hier startet der große Kreislauf. Die beiden Kreisläufe sind in Reihe geschaltet, es geht also gleich viel Blut hindurch – nur bei sehr unterschiedlichem Druck.",
 sci:"Der Lungenkreislauf kann mit niedrigem Druck arbeiten, weil er kurz und weit ist: So kann die Wand der Kapillaren dünn bleiben, was Voraussetzung für den Gasaustausch ist. Steigt dieser Druck dauerhaft – beim Lungenhochdruck –, wird die rechte Kammer überlastet.",
 tie:"Die tiefe, langsame Atmung pumpt mit der Bewegung des Zwerchfells buchstäblich das venöse Blut zum Herzen: Beim Einatmen saugt der sinkende Brustkorbdruck es an, beim Ausatmen schiebt der steigende Druck es weiter.",
 sl:["des Drucks im Körperkreislauf","mittlerer Druck der Lungenarterie","ein ganzer Rundweg"],exs:["belly","koherens"],
 d:["LUNGE","rechts","links","HERZ","Lungenarterie · CO₂-reich","Lungenvene · O₂-reich","Kapillaren der Gewebe","Aorta","große Venen","KLEINER KREISLAUF","niedriger Druck","GROSSER KREISLAUF","fünfmal höherer Druck"]},
{name:"Die Ausatmung",phase:"Ausatmung",tag:"In Ruhe nicht einmal Arbeit – nur Zurückfedern",
 short:"Das Zwerchfell entspannt sich, die Lunge zieht sich elastisch zurück, die Luft entweicht.",
 cap:"Links das Einatmen: Das Zwerchfell flacht ab, die Rippen heben sich. Rechts das Ausatmen: Alles fällt zurück. Unten das Wellen des Pulses – das ist die respiratorische Sinusarrhythmie.",
 what:"Beim Einatmen zieht sich das Zwerchfell zusammen und flacht ab, und die Rippen heben sich nach oben und außen wie ein Eimerhenkel – der Brustkorb weitet sich so in alle Richtungen, der Innendruck sinkt, und die Luft strömt ein. Beim Ausatmen in Ruhe braucht es dagegen keine gesonderte Muskelarbeit: Das Zwerchfell entspannt sich, wölbt sich kuppelförmig zurück, die Rippen fallen zurück, und das gespannte Lungengewebe federt einfach zurück. So entweicht die kohlendioxidreiche Luft auf demselben Weg: Bronchiolen, Bronchien, Luftröhre, Nase. Beim kräftigen Ausatmen – beim Husten, beim Feueratem – helfen auch die Bauchmuskeln mit.",
 sci:"Aus Sicht des Nervensystems ist das Ausatmen die wichtigste Phase. Die Pulskurve unten in der Zeichnung zeigt es: Während der langen Ausatmung steigt die Aktivität des Vagusnervs, der den Herzschlag verlangsamt; beim Einatmen lockert diese Bremse und der Puls wird schneller. Das nennt man respiratorische Sinusarrhythmie, und je ausgeprägter sie ist, desto besser deine Herzratenvariabilität. Deshalb ist die beruhigende Wirkung stärker, wenn das Ausatmen länger dauert als das Einatmen.",
 tie:"Die ganze App in einem Satz: Nicht das tiefe Einatmen beruhigt dich, sondern das langsame Ausatmen. Deshalb 4-7-8 und nicht 8-7-4, und deshalb dauert das Ausatmen beim Bienensummen doppelt so lange wie das Einatmen.",
 sl:["ein Atemzug in Ruhe","Atemzüge pro Minute","Muskelarbeit dafür nötig"],exs:["n478","bhramari","belly"],
 d:["EINATMEN","Zwerchfell flacht ab, Rippen heben sich","AUSATMEN","entspannt sich, wölbt sich – passiv","Puls","Einatmen: schneller","Ausatmen: langsamer"]}
]};

ex:{
box:{name:"Box breathing",eyebrow:"Yoga (sama vritti) · also used by Navy SEALs",
 desc:"The best-researched calming technique: four equal 4-second segments, like the four sides of a square. During the hold, carbon dioxide builds up briefly in the blood – this slows the heart rate and switches on the parasympathetic (rest-and-digest) nervous system.",
 daily:"2–3 times a day, 4–6 rounds each time (2–3 minutes) – plus immediately whenever stress hits.",
 effects:"Lowers cortisol (the stress hormone) and blood pressure, improves focus and mood, helps with panic, anxiety and insomnia.",
 steps:["Sit with a straight back, feet on the floor, hands loose in your lap.","Slowly blow out all the air through your mouth.","Inhale through the nose for 4 seconds – into the belly, not the chest.","Hold for 4 seconds.","Exhale slowly for 4 seconds.","Stay with empty lungs for 4 seconds, then start again."],
 warn:"If 4 seconds is too much, start with 2–3 seconds – it works just the same.",
 ph:[["Inhale through the nose",""],["Hold it in",""],["Exhale",""],["Stay empty",""]]},
n478:{name:"4-7-8 breathing",eyebrow:"Dr Andrew Weil · built on pranayama",
 desc:"The natural tranquilliser of the nervous system – the secret is the long, 8-second exhale, which strongly activates the rest system. For falling asleep it is one of the most effective exercises.",
 daily:"Twice a day: after waking and before bed. At first no more than 4 rounds, after a few weeks up to 8.",
 effects:"Proven to reduce anxiety and blood pressure, helps you fall asleep, and can also dull the perception of pain.",
 steps:["Sit with a straight back (not standing at first – you may get dizzy).","Put the tip of your tongue on the palate behind your upper teeth and keep it there throughout.","Blow all the air out through your mouth with a soft hissing sound.","Inhale through the nose with your mouth closed for 4 seconds.","Hold for 7 seconds.","Exhale through the mouth for 8 seconds."],
 warn:"Mild dizziness in the first weeks is normal – practise sitting down.",
 ph:[["Inhale through the nose","tongue behind the upper teeth"],["Hold it in",""],["Exhale through the mouth","slowly, hissing"]]},
belly:{name:"Belly breathing",eyebrow:"Diaphragmatic breathing · the basis of every technique",
 desc:"The foundation of deep breathing: you breathe with the diaphragm (the dome-shaped muscle under the lungs), not with the chest. If your belly rises and your chest does not, you are doing it right.",
 daily:"While learning, 1–2 times a day for 5–10 minutes; once it clicks, any time, unnoticed – even standing at the machine.",
 effects:"Reduces stress and blood pressure, improves digestion, strengthens the diaphragm and core stability. A basic exercise in COPD and asthma.",
 steps:["Sit or lie down comfortably, one hand on your chest, the other on your belly.","Breathe normally for a minute and notice: which hand moves?","Inhale slowly through the nose for 4 seconds so that the hand on your belly rises.","Exhale slowly for 6 seconds through slightly pursed lips, as if blowing on a candle.","Practise 5–10 minutes a day until it becomes natural."],
 warn:"You can use it during physical work, standing at the machine – nobody can see that you are practising.",
 ph:[["Inhale into the belly","the hand on your belly rises"],["Slow exhale","pursed lips, like blowing a candle"]]},
koherens:{name:"Coherent breathing",eyebrow:"Resonance breathing · about 5–6 breaths per minute",
 desc:"You slow your breathing to about 5-6 breaths per minute – this is the resonance frequency of the cardiovascular system. At this pace heart rate variability (the fluctuation between heartbeats, the main marker of stress resilience) reaches its maximum.",
 daily:"Ideally 10–20 minutes a day, in one go or split up. Excellent for the post-lunch slump too.",
 effects:"Proven to improve heart rate variability, lowers blood pressure, anxiety and depressive symptoms. There is no breath holding, so it is the safest technique.",
 steps:["Sit or lie down comfortably and breathe through your nose.","Inhale slowly into the belly for about 5-6 seconds.","Exhale just as slowly – with no effort and no pause.","The breath should be light and quiet, like a wave.","Continue for 10–20 minutes."],
 warn:"Suitable for practically everyone. If 5.5 seconds is too much, 4.5 works too.",
 ph:[["Inhale","slowly, into the belly"],["Exhale","without effort"]]},
nadi:{name:"Alternate nostril breathing",eyebrow:"Yoga pranayama · cleansing the channels",
 desc:"A classic yoga exercise: you breathe through the two nostrils in turn. Yoga says it balances the two hemispheres; physiologically it is slow, deliberate nasal breathing that calms deeply.",
 daily:"1–2 times a day, 5–10 rounds, on an empty stomach (2–3 hours after eating). It clears the head in the morning and helps sleep in the evening.",
 effects:"Calms the nervous system, reduces stress, improves lung capacity and blood oxygenation, and over time also regulates blood pressure.",
 steps:["Sit with a straight spine, on an empty stomach.","Right hand: thumb to the right nostril, ring finger to the left – just touch gently.","Close the right nostril, inhale through the left for 4 seconds.","Close both, hold for 4 seconds.","Open the right, exhale through it for 4 seconds.","Inhale there again, hold, then exhale through the left – that is one full round."],
 warn:"Do not do it with a cold or a nose or throat infection.",
 ph:[["Inhale left nostril","right nostril closed with the thumb"],["Hold it in","both nostrils closed"],["Exhale right nostril","left closed with the ring finger"],["Inhale right nostril","left stays closed"],["Hold it in","both nostrils closed"],["Exhale left nostril","right closed"]]},
ujjayi:{name:"Ujjayi – ocean breath",eyebrow:"Yoga pranayama · the base breath of yoga practice",
 desc:"By slightly narrowing your throat you give the breath a soft sound like the murmur of the ocean. The sound is audible feedback: if it is even, so is your breath.",
 daily:"Throughout movement or yoga; for focus, 3–5 minutes during the day. No daily upper limit.",
 effects:"Improves concentration, calms even during movement, slows and deepens the breath.",
 steps:["Breathe through your nose with your mouth closed.","Narrow your throat slightly – as if you wanted to fog a mirror with your mouth shut.","The air then flows in and out with a soft murmur.","Inhale about 5 seconds, exhale about 5 seconds, evenly.","If the sound breaks up, slow down – the sound is your guide."],
 warn:"The murmur should be quiet, audible only to you – do not strain your throat.",
 ph:[["Inhale – soft murmur","throat slightly narrowed"],["Exhale – soft murmur","evenly, through the nose"]]},
bhramari:{name:"Bee breath",eyebrow:"Yoga pranayama · the fastest-acting calmer",
 desc:"On the exhale you hum a deep tone with your mouth closed, like a bee. The vibration is felt through the whole skull – this is one of the fastest-acting calming exercises.",
 daily:"1–2 times a day, 5–7 hums each time. Most effective before falling asleep.",
 effects:"Immediately lowers tension and pulse, and according to research blood pressure too. Humming raises the nitric oxide released from the sinuses many times over.",
 steps:["Sit with your eyes closed in a quiet place.","Gently close your ears at the cartilage with your index fingers.","Inhale through the nose for 4 seconds.","On the exhale hum a deep tone with your mouth closed, for as long as feels comfortable.","Notice the vibration in your head and chest."],
 warn:"With an ear infection do not close the ears – it works without that too.",
 ph:[["Inhale through the nose","ears gently closed"],["Humming exhale","mouth closed, feel the vibration"]]},
kapalabhati:{name:"Kapalabhati – breath of fire",eyebrow:"Yoga cleansing exercise · shining skull",
 desc:"An energising cleansing exercise: the exhale is fast and forceful, snapping the abdominal muscles in, while the inhale happens by itself, passively. It is like a coffee – made purely of breath.",
 daily:"Once a day, as a beginner 3 sets of 20 pumps, on an empty stomach. Not in the afternoon or evening – it revs you up.",
 effects:"Energises and wakes you up, works the abdominal muscles and diaphragm, clears the nasal passages, stimulates digestion.",
 steps:["Sit with a straight spine, on an empty stomach, hands on your knees.","Take a deep breath.","Forceful, fast exhale through the nose with a sharp snap of the belly – about one pump per second.","Do not worry about the inhale: it happens by itself as the belly relaxes.","After 20 pumps take a deep breath, exhale slowly, rest for a few breaths."],
 warn:"FORBIDDEN in pregnancy, high blood pressure, heart disease, epilepsy, hernia or after recent abdominal surgery. Stop immediately if you feel dizzy.",
 ph:[["Forceful exhale","belly snapped in"],["Passive inhale","the belly relaxes"],["Deep inhale",""],["Slow exhale",""],["Rest","breathe naturally"]]},
tummo:{name:"Tummo – inner fire",eyebrow:"Tibetan monks · the six yogas of Naropa, 8th century",
 desc:"The inner fire practice of Himalayan monks: forceful belly breathing plus visualising a flame behind the navel. Harvard researchers (Benson, 1982) measured that trained monks can raise the temperature of their extremities by as much as 8 °C.",
 daily:"Once a day, 3 rounds, after waking on an empty stomach. Avoid in the evening – it revs you up.",
 effects:"Energises and warms (it also activates brown fat tissue), improves cold tolerance, brings on a deep meditative state.",
 steps:["Sit comfortably with a straight spine, hands on your belly. This is the simplified, secular version.","Picture a small flame behind your navel that grows stronger with each breath.","Deep, fast inhale through the nose into the belly, then a forceful exhale through the mouth.","Repeat 15 times in this rhythm.","After the last exhale stay with empty lungs for as long as feels comfortable.","Inhale deeply, hold for 4–5 seconds, then exhale slowly."],
 warn:"NEVER do it in water, while driving or standing – breath holding can cause fainting. Skip it if you have heart disease, epilepsy or are pregnant.",

map:[
{name:"The nose",phase:"Inhale",tag:"Filter, heater, humidifier – and a gas factory",
 short:"The air is filtered, warmed to body temperature and saturated with moisture.",
 cap:"Longitudinal section of the head from the side. Air enters from the left, the three turbinates force it into swirls, then it turns down towards the throat.",
 what:"Three bony shelves, the turbinates, project from the wall of the nasal cavity – in the drawing the three tongues curling upwards. They force the air into swirls, so it touches a far larger area of moist, well-supplied mucous membrane. Within a few centimetres the inhaled air warms to body temperature, by the main bronchi it becomes practically saturated with vapour, and the larger particles get caught in the mucus layer. If you breathe through your mouth, all of this preparation is skipped, and the burden of the drier air falls on the lining of the windpipe.",
 sci:"The paranasal sinuses – in the drawing the three cavities in the forehead, the cheekbone and deep in the skull – continuously produce nitric oxide (NO), which is carried down into the lungs on the inhale. NO dilates vessels and airways, improves the match between ventilation and blood flow, and also has antiviral and antibacterial properties. Measurements show that with nasal breathing the oxygen pressure measured at the skin is roughly 10% higher than with mouth breathing.",
 tie:"That is why almost every technique starts with inhaling through the nose. Bee breath belongs here in its own right: the vibration of humming raises the amount of NO flowing out of the sinuses many times over.",
 sl:["the air is warmed to this","humidity at the main bronchi","of the moisture comes from the nose"],exs:["nadi","bhramari"],
 d:["turbinates (3)","dust and pollen get caught","sinuses","towards the throat","mucous membrane","air"]},
{name:"Larynx and windpipe",phase:"Inhale",tag:"Horseshoe-shaped cartilage rings and a mucus escalator",
 short:"An 11 cm tube held open by cartilage rings, cleaning itself from the inside.",
 cap:"On the left the windpipe from the front with the cartilage rings and the fork; on the right the wall magnified: mucus layer, cilia, goblet cells.",
 what:"Passing the larynx, the air reaches the windpipe: a tube about 10–12 cm long, held open by horseshoe-shaped cartilage rings that are open at the back. They are not complete circles precisely so that the oesophagus running behind can expand when you swallow. At the bottom, at the carina, it splits into two main bronchi; the right one is thicker and steeper, which is why a swallowed object more often ends up there. The inside is lined with ciliated epithelium: millions of microscopic hairs push a thin layer of mucus upwards towards the throat. In the magnified detail, the goblet cells between the hairs produce the mucus itself.",
 sci:"The cilia beat in coordinated waves, and their movement is regulated among other things by the nitric oxide produced in the nose. If the air is too dry – with mouth breathing, for example – the mucus thickens and the escalator slows down. Cigarette smoke demonstrably degrades this cleaning mechanism.",
 tie:"Ujjayi (ocean breath) narrows the gap slightly right here at the larynx – the soft murmur that results is audible feedback on how even your airflow is.",
 sl:["length of the windpipe","horseshoe cartilage rings","where airway numbering starts"],exs:["ujjayi"],
 d:["cilia","mucus layer","goblet cells","the dirt travels upwards","larynx","windpipe","left main bronchus","right main bronchus","oesophagus","carina"]},
{name:"Bronchi and bronchioles",phase:"Inhale",tag:"23 branchings, a tree turned upside down",
 short:"The tube splits in two, then again and again – about 23 generations in all.",
 cap:"The outline of both lungs with their lobes, and the bronchial tree inside. The right lung has 3 lobes, the left 2 – on the left, room must be left for the heart.",
 what:"The windpipe splits into two main bronchi, then every branch splits in two again. The average path from the windpipe to the edge of the lung means about 23 such branchings, but in reality it is not regular: you can see in the drawing that the branches differ in length and thickness – this is called irregular dichotomy. The first 16 generations only transport; there is no gas exchange yet. From the 17th branching the first air sacs appear in the wall, and from there the air flows more slowly at every step until movement is finally taken over by plain diffusion.",
 sci:"At every division the combined cross-section of the branches grows, so the speed of the air drops dramatically. The smallest bronchioles no longer have a cartilage frame, only a ring of smooth muscle – these are what cramp shut in an asthma attack. The volume of the conducting zone is the dead space: about 150 ml, lost to gas exchange with every breath.",
 tie:"That is why one slow, deep breath is more efficient than two hurried ones: the dead space is the same, but with a bigger breath proportionally far less of it is wasted.",
 sl:["branching generations","only transports (conducting zone)","already exchanges gas"],exs:["belly","koherens"],
 d:["windpipe","main bronchi","lobar bronchi","gas exchange starts here","right lung · 3 lobes","left lung · 2 lobes","space for the heart"]},
{name:"The air sacs",phase:"Gas exchange",tag:"Half a tennis court, folded into your chest",
 short:"Several hundred million tiny sacs, woven through by a dense capillary net.",
 cap:"On the left an alveolar sac with the capillary net and the red blood cells travelling through it. On the right the cross-section of the wall, layer by layer.",
 what:"The final branches end in clusters: these are the air sacs, the alveoli. In the drawing they are deliberately polygonal, because in reality they are not spheres – pressed tightly together, they share honeycomb-like walls. Each is only a fifth of a millimetre across, and there are several hundred million of them. Spread out, their surface would cover half a tennis court. Each is wrapped in a dense capillary net in which the red blood cells travel in single file. The cross-section on the right shows how thin the dividing wall is: from the air side a film of fat, a flat epithelial cell, a shared basement membrane, a vessel wall cell – and you are already in the blood.",
 sci:"The inside of the sacs is coated with a surface-active substance, surfactant – this stops the tiny sacs from sticking together on the exhale. In emphysema the walls break down and the sacs merge into fewer, larger cavities: the surface area drops drastically. In pulmonary fibrosis the opposite happens, the wall thickens and the passage of gases slows.",
 tie:"A deep belly inhale also opens the lower lung lobes – that is where the capillary net is densest, so that is where gas exchange is most effective. Shallow chest breathing largely skips this region.",
 sl:["air sacs in total","exchange surface","the air-blood wall"],exs:["belly","koherens"],
 d:["air","surfactant film","epithelial cell","basement membrane","vessel wall cell","blood + red cell","0.5–1 µm the whole wall","bronchiole","air sacs","capillary net","blood is here 0.75 s – the exchange takes 0.25 s"]},
{name:"Gas exchange itself",phase:"Gas exchange",tag:"No pump at all – just a pressure difference",
 short:"Oxygen and carbon dioxide migrate on their own, from higher pressure to lower.",
 cap:"The two sides of the wall. O₂ (two linked balls) travels left to right, CO₂ (three balls) right to left, each down its own pressure slope.",
 what:"There is no pump here and no active transport: every gas goes from where its own pressure is higher to where it is lower. In the air sac the oxygen pressure is about 100 mmHg, in the arriving blood only 40 – this difference of sixty drives oxygen inwards, where haemoglobin in the red blood cell picks it up at once. For carbon dioxide the difference is only 5 mmHg, but CO₂ dissolves and crosses the wall roughly twenty times faster, so even this small slope is more than enough.",
 sci:"At rest the red blood cell spends about 0.75 seconds in the capillary, but equilibration is complete after a third of the way – so there is a threefold safety margin. That is why the bottleneck is not diffusion but blood flow: this is called perfusion-limited exchange.",
 tie:"This shows why hurried breathing solves nothing: the blood becomes saturated anyway. What slow breathing improves is the better match between ventilation and blood flow across the whole lung.",
 sl:["O₂ pressure slope, mmHg","CO₂ pressure slope, mmHg","to reach equilibrium"],exs:["koherens","box"],
 d:["AIR SAC","CAPILLARY","wall","haemoglobin picks it up","into the exhaled air"]},
{name:"Blood and haemoglobin",phase:"O₂ transport",tag:"Four iron atoms, four seats for oxygen",
 short:"Oxygen dissolves poorly in blood – so it gets into a taxi, haemoglobin.",
 cap:"On the left the disc shape of the red blood cell with its dimpled centre, and inside it the four subunits of haemoglobin. On the right the saturation curve: the S shape is the sign of cooperative binding.",
 what:"Oxygen dissolves poorly in water, so hardly any of it fits into blood plasma. The solution is haemoglobin: a protein of four subunits inside the red blood cells – two alpha and two beta chains – each with a flat haem disc in the middle, at the heart of which sits an iron atom. One iron binds one oxygen molecule, so one haemoglobin carries four. 98.5% of the oxygen carried travels this way, and only 1.5% dissolves freely in the plasma. The red blood cell has no nucleus and is flat in the middle precisely so that as much haemoglobin as possible fits inside.",
 sci:"Binding is not even: as the first oxygen attaches, the protein changes shape and takes the second and third more easily. This is cooperative binding, and it is what gives the saturation curve on the right its S shape. The upper, flat part is the lung: here even a large pressure drop barely lowers saturation. The steep middle part is the tissue: here a small pressure drop releases a great deal of oxygen. In a more acidic, warmer, CO₂-rich environment the curve shifts right – this is the Bohr effect.",
 tie:"This explains why over-breathing does not help: the top of the curve is flat, and your blood at rest is already at 97–99%. What really changes with fast breathing is the carbon dioxide level.",
 sl:["O₂ on one haemoglobin","bound to haemoglobin","for the cell to saturate"],exs:["wimhof","koherens"],
 d:["O₂ molecule","haem + iron atom","red blood cell · 4 sites","saturation","tissue","lung","O₂ pressure →","steep part:","it releases O₂ here"]},
{name:"Heart and arteries",phase:"O₂ transport",tag:"The left heart: the high-pressure pump",
 short:"The oxygen-rich blood returning from the lungs sets off into the body via the left heart.",
 cap:"The four chambers of the heart in section. Violet is the CO₂-rich side, pink the oxygen-rich one; the short lines are the valves.",
 what:"The freshly oxygenated blood arrives through the pulmonary veins in the left atrium, then through the valve into the left ventricle, the strongest muscular pump in the body – in the drawing you can clearly see that its wall is far thicker than the right side. From here it sets off into the aorta, then through ever smaller arteries to the capillaries. The right side moves just as much blood, but only as far as the lungs, at far lower pressure. At rest the heart moves roughly five litres of blood per minute, and the whole round trip of a red blood cell takes less than a minute.",
 sci:"The pulmonary and systemic circulations are connected in series, so both halves of the heart move the same amount of blood, only at very different pressures. On the inhale the falling pressure in the chest draws more blood back to the heart – which is why your pulse speeds up on the inhale and slows on the exhale.",
 tie:"This waving of the pulse is respiratory sinus arrhythmia, the basis of heart rate variability. That is why the effect of slow breathing is measurable directly on the heart.",
 sl:["cardiac output at rest","one full round trip","arterial O₂ pressure"],exs:["koherens","box"],
 d:["right","left","atrium","superior vena cava","inferior vena cava","pulmonary artery","AORTA","pulmonary veins","tissues, capillaries","ventricle","~5 l/min","cardiac output at rest","the left ventricle wall","is three times thicker"]},
{name:"The cell and the mitochondrion",phase:"Cell",tag:"The end of the road: this is where air becomes energy",
 short:"Oxygen closes the energy-producing chain in the power plants of the cell.",
 cap:"Section through a mitochondrion. The four complexes and ATP synthase sit on the folds of the inner membrane; protons are pumped out, then rush back through ATP synthase.",
 what:"In the capillaries oxygen leaves the blood and enters the cells, and within them the mitochondria. These have two membranes, and the inner one is deeply folded – these cristae provide the huge working surface. Electrons from the breakdown of glucose travel through four protein complexes embedded in the folds. At every step they pump protons out between the two membranes, where the charge builds up like water behind a dam. The protons then rush back through ATP synthase, and this backflow drives the production of ATP. Oxygen enters at the fourth complex: it burns nothing, it simply accepts the spent electrons and turns into water. Without it the whole line backs up and stops.",
 sci:"The oxygen-poor, more acidic tissue environment helps too: haemoglobin holds oxygen more loosely here and releases it generously. The red blood cell itself, however, is a curious exception – it has no mitochondria, so it consumes none of the oxygen it carries.",
 tie:"This is where the effect of tummo and Wim Hof breathing becomes clear too: you warm up because of the boosted metabolism and the adrenaline response, not because you took in more oxygen.",
 sl:["ATP from one glucose","the last link in the chain","by-product of the process"],exs:["tummo","wimhof"],
 d:["H⁺ back","O₂ + 4H⁺ → H₂O","citric acid cycle","NADH → complex I","glucose","folds of the inner membrane (cristae)","outer","membrane"]},
{name:"The return journey of CO₂",phase:"CO₂ return",tag:"It travels in three forms, not one",
 short:"Most of the CO₂ goes back not as a gas but as bicarbonate.",
 cap:"Inside the red blood cell: carbonic anhydrase turns CO₂ into carbonic acid, the bicarbonate is swapped for chloride, and the hydrogen ion is caught by haemoglobin.",
 what:"Carbon dioxide passes from the cells into the blood, and most of it diffuses straight into the red blood cells. There a very fast enzyme, carbonic anhydrase, turns it with water into carbonic acid, which immediately falls apart into a hydrogen ion and bicarbonate. The hydrogen ion is caught by haemoglobin so the blood does not turn acidic, and the bicarbonate leaves for the plasma – in its place a chloride enters through the exchanger in the membrane so the electrical balance is kept. This way about 70% of the CO₂ travels as bicarbonate, roughly 23% bound to the protein part of haemoglobin, and only 7% stays freely dissolved. In the lungs the same process runs in reverse.",
 sci:"This system is also the engine of the body's most important pH buffer. If you breathe fast and deep, you blow off more CO₂ than is produced: the blood becomes more alkaline, and tingling, dizziness and hand cramps follow. If instead you hold your breath, CO₂ builds up – and the urge to breathe is triggered primarily by exactly that, not by lack of oxygen.",
 tie:"This is the key to box breathing and to 4-7-8 as well: the hold deliberately lets a little CO₂ build up, which slows the pulse. Breath of fire and the Wim Hof method push the same thing in the opposite direction.",
 sl:["as bicarbonate","bound to haemoglobin","as dissolved gas"],exs:["box","n478","wimhof"],
 d:["from the tissue","carbonic anhydrase","Hb binds it","out","in","chloride shift","how the CO₂ splits up","bound to Hb","dissolved gas","in the lungs all of this","runs in reverse","inside the red blood cell"]},
{name:"Back to the lungs",phase:"CO₂ return",tag:"The two circuits that link into each other",
 short:"The CO₂-rich blood returns to the air sacs through the right heart.",
 cap:"The whole circulation in one picture. The small circuit belongs to the lungs, the large one to the body – the two are connected in series in the heart.",
 what:"The carbon-dioxide-rich blood reaches the right atrium through the great veins, and from there the right ventricle. The only artery in the body that carries oxygen-poor blood is precisely the pulmonary artery – in the drawing the violet branch leaving the heart towards the lungs. At the air sacs the bicarbonate turns back into CO₂, it passes into the air, haemoglobin reloads with oxygen and returns through the pink pulmonary veins to the left heart. From there the great circuit begins. The two circuits are in series, so the same amount of blood passes through both – only at very different pressures.",
 sci:"The pulmonary circuit can work at low pressure because it is short and wide: this lets the capillary walls stay thin, which is the condition for gas exchange. If this pressure stays elevated – in pulmonary hypertension – the right ventricle becomes overloaded.",
 tie:"Deep, slow breathing literally pumps venous blood towards the heart through the movement of the diaphragm: on the inhale the falling chest pressure draws it in, on the exhale the rising pressure pushes it on.",
 sl:["of the pressure in the systemic circuit","mean pulmonary artery pressure","one full round trip"],exs:["belly","koherens"],
 d:["LUNGS","right","left","HEART","pulmonary artery · CO₂-rich","pulmonary vein · O₂-rich","capillaries of the tissues","aorta","great veins","SMALL CIRCUIT","low pressure","GREAT CIRCUIT","five times higher pressure"]},
{name:"The exhale",phase:"Exhale",tag:"At rest it is not even work – just springing back",
 short:"The diaphragm relaxes, the lung recoils elastically, the air leaves.",
 cap:"On the left the inhale: the diaphragm flattens, the ribs rise. On the right the exhale: everything falls back. Below, the waving of the pulse – this is respiratory sinus arrhythmia.",
 what:"On the inhale the diaphragm contracts and flattens, and the ribs rise up and outwards like a bucket handle – the chest widens in every direction, the pressure inside drops, and air flows in. On a resting exhale, however, no separate muscle work is needed: the diaphragm relaxes, rises back into its dome, the ribs fall back, and the stretched lung tissue simply springs back. That is how the carbon-dioxide-rich air leaves along the same route: bronchioles, bronchi, windpipe, nose. On a forceful exhale – coughing, breath of fire – the abdominal muscles help out too.",
 sci:"From the nervous system's point of view the exhale is the most important phase. The pulse curve at the bottom of the drawing shows it: during the long exhale the activity of the vagus nerve rises, slowing the heartbeat; on the inhale that brake eases and the pulse speeds up. This is called respiratory sinus arrhythmia, and the more pronounced it is, the better your heart rate variability. That is why the calming effect is stronger when the exhale is longer than the inhale.",
 tie:"The whole app in one sentence: it is not the deep inhale that calms you, it is the slow exhale. That is why it is 4-7-8 and not 8-7-4, and why the exhale in bee breath lasts twice as long as the inhale.",
 sl:["one resting breath","breaths per minute","muscle work needed"],exs:["n478","bhramari","belly"],
 d:["INHALE","diaphragm flattens, ribs rise","EXHALE","relaxes, domes up – passive","pulse","inhale: speeds up","exhale: slows down"]}
]};


/* ═══════════════ MOTOR ═══════════════ */
const $=id=>document.getElementById(id);
const nav=$("nav"),orb=$("orb"),core=$("orbCore"),rim=$("orbRim"),halo=$("halo"),
 countEl=$("count"),phaseEl=$("phase"),noteEl=$("note"),startBtn=$("startBtn"),resetBtn=$("resetBtn"),
 exNameEl=$("exName"),exBadgeEl=$("exBadge"),cycleEl=$("cycleInfo"),barFill=$("barFill"),detailEl=$("detail"),
 menuEl=$("menu"),menuBtn=$("menuBtn"),backdrop=$("backdrop"),viewEx=$("viewEx"),viewMap=$("viewMap"),
 viewVid=$("viewVid"),
 discEx=$("discEx"),track=$("track"),modal=$("modal"),modalBox=$("modalBox"),modalContent=$("modalContent");

const LANGS=[["hu","HU"],["ro","RO"],["de","DE"],["en","EN"]];
let lang=(navigator.language||"hu").slice(0,2);
if(!L[lang]) lang="hu";
let T=L[lang];
let cur="box",state="idle",pi=0,cyc=0,endT=0,remain=0,timer=null,doneMs=0,totalMs=0,mapIdx=0,view="ex";

/* ── nyelvsáv ── */
LANGS.forEach(([code,label])=>{
  const b=document.createElement("button");
  b.textContent=label; b.dataset.l=code;
  b.onclick=()=>setLang(code);
  $("langbar").appendChild(b);
});
function setLang(code){
  lang=code; T=L[code];
  document.documentElement.lang=code;
  document.querySelectorAll("#langbar button").forEach(b=>b.classList.toggle("on",b.dataset.l===code));
  buildAll();
}

/* ── paletta ── */
function buildPals(){
  const el=$("pals"); el.innerHTML="";
  $("palTitle").textContent=T.ui.palTitle;
  T.pals.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="pal"; b.dataset.p=p.id;
    b.innerHTML='<b>'+p.name+'</b><em>'+p.desc+'</em><span class="sw">'+
      p.sw.map(c=>'<i style="background:'+c+'"></i>').join("")+'</span>';
    b.onclick=()=>setPal(p.id);
    el.appendChild(b);
  });
  setPal(document.documentElement.getAttribute("data-pal")||"naplemente");
}
function setPal(id){
  document.documentElement.setAttribute("data-pal",id);
  document.querySelectorAll(".pal").forEach(x=>x.classList.toggle("on",x.dataset.p===id));
  const p=T.pals.find(p=>p.id===id); if(p) $("palnote").textContent=p.note;
}

/* ── menü ── */
function buildMenu(){
  nav.innerHTML="";
  const h=document.createElement("p"); h.className="menu-group"; h.textContent=T.ui.mapGroup; nav.appendChild(h);
  const b=document.createElement("button");
  b.className="menu-item"; b.dataset.key="__map"; b.style.setProperty("--mi","var(--ink)");
  b.innerHTML='<span class="dot sq"></span>'+T.ui.mapItem;
  b.onclick=()=>{showMap();closeMenu();};
  nav.appendChild(b);

  const vh=document.createElement("p"); vh.className="menu-group"; vh.textContent=T.ui.vidGroup; nav.appendChild(vh);
  const vb=document.createElement("button");
  vb.className="menu-item"; vb.dataset.key="__vid"; vb.style.setProperty("--mi","var(--ink)");
  vb.innerHTML='<span class="dot sq"></span>'+T.ui.vidItem;
  vb.onclick=()=>{showVideos();closeMenu();};
  nav.appendChild(vb);

  const COL=["var(--p-in)","var(--p-hold)","var(--p-out)"];
  T.ui.groups.forEach((g,gi)=>{
    const t=document.createElement("p"); t.className="menu-group"; t.textContent=g; nav.appendChild(t);
    EXKEYS.filter(k=>META[k].group===gi).forEach(k=>{
      const it=document.createElement("button");
      it.className="menu-item"; it.dataset.key=k; it.style.setProperty("--mi",COL[gi]);
      it.innerHTML='<span class="dot"></span>'+T.ex[k].name;
      it.onclick=()=>{select(k);closeMenu();};
      nav.appendChild(it);
    });
  });
}
function closeMenu(){menuEl.classList.remove("open");backdrop.classList.remove("show");}
menuBtn.onclick=()=>{menuEl.classList.add("open");backdrop.classList.add("show");};
backdrop.onclick=closeMenu;
function markMenu(k){document.querySelectorAll(".menu-item").forEach(m=>m.classList.toggle("active",m.dataset.key===k));}

/* ── elmetérkép ── */
function buildMap(){
  track.innerHTML='<div class="spine"></div><div class="flowdot"></div>';
  SMETA.forEach((s,i)=>{
    const t=T.map[i];
    const b=document.createElement("button");
    b.className="station"; b.style.setProperty("--sa",s.c);
    b.innerHTML='<span class="st-ico">'+s.ico+'</span><span class="st-body">'+
      '<span class="st-top"><span class="st-num">'+String(i+1).padStart(2,"0")+'</span>'+
      '<span class="st-name">'+t.name+'</span><span class="st-phase">'+t.phase+'</span></span>'+
      '<span class="st-short">'+t.short+'</span>'+
      '<span class="st-open">'+T.ui.openStation+'</span></span>';
    b.onclick=()=>openStation(i);
    track.appendChild(b);
  });
  $("mapLegend").innerHTML=T.ui.legend.map((x,i)=>
    '<span><i style="background:'+["var(--p-in)","var(--p-out)","var(--art)","var(--acc)","var(--ven)"][i]+'"></i>'+x+'</span>').join("");
}

/* ── videók ── */
function buildVideos(){
  $("vidH1").textContent=T.ui.vidH1;
  $("vidSub").textContent=T.ui.vidSub;
  $("vidTitle").textContent=T.ui.vidTitle;
  $("vidLead").textContent=T.ui.vidLead;
  $("vidDisc").textContent=T.ui.disc;
  const g=$("vidGrid"); g.innerHTML="";
  VIDEOS.forEach((v,i)=>{
    const c=document.createElement("div"); c.className="vid-card";
    const t=v.title || T.ui.vidPlaceholder.replace("{n}", i+1);
    const inner=v.id
      ? '<div class="vid-wrap"><iframe src="https://www.youtube-nocookie.com/embed/'+v.id+
        '" title="'+t.replace(/"/g,"&quot;")+'" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>'
      : '<div class="vid-wrap"><span class="vid-ph">'+T.ui.vidSoon+'</span></div>';
    c.innerHTML = inner + '<p class="vid-title'+(v.title?"":" ph")+'">'+t+'</p>';
    g.appendChild(c);
  });
}

function openStation(i){
  mapIdx=i; const s=SMETA[i], t=T.map[i];
  modalBox.style.setProperty("--sa",s.c);
  modalContent.innerHTML=
   '<p class="m-eyebrow">'+String(i+1).padStart(2,"0")+' · '+t.phase+'</p>'+
   '<h2 class="m-title">'+t.name+'</h2><p class="m-tag">'+t.tag+'</p>'+
   '<div class="dia-wrap">'+DIA[s.id](t.d)+'</div><p class="diacap">'+t.cap+'</p>'+
   '<p class="m-h">'+T.ui.hWhat+'</p><p class="m-p">'+t.what+'</p>'+
   '<p class="m-h">'+T.ui.hNum+'</p><div class="stats">'+
     s.v.map((v,j)=>'<div class="stat"><b>'+v+'</b><span>'+t.sl[j]+'</span></div>').join("")+'</div>'+
   '<p class="m-h">'+T.ui.hSci+'</p><p class="m-p">'+t.sci+'</p>'+
   '<div class="tiein"><b>'+T.ui.hTie+'</b>'+t.tie+'</div>'+
   '<p class="m-h">'+T.ui.hEx+'</p><div class="slots">'+
     t.exs.map(k=>'<button class="slot on jump" data-k="'+k+'">'+T.ex[k].name+' ↗</button>').join("")+'</div>'+
   '<div class="m-nav"><button id="mPrev"'+(i===0?" disabled":"")+'>← '+(i>0?T.map[i-1].name:"")+'</button>'+
   '<button id="mNext"'+(i===SMETA.length-1?" disabled":"")+'>'+(i<SMETA.length-1?T.map[i+1].name:"")+' →</button></div>';
  modal.classList.add("show");
  modalContent.querySelectorAll(".jump").forEach(b=>b.onclick=()=>{closeModal();select(b.dataset.k);});
  const p=$("mPrev"),n=$("mNext");
  if(p&&i>0)p.onclick=()=>openStation(i-1);
  if(n&&i<SMETA.length-1)n.onclick=()=>openStation(i+1);
  modalBox.scrollTop=0;
}
function closeModal(){modal.classList.remove("show");}
$("mClose").onclick=closeModal; $("modalBg").onclick=closeModal;
document.addEventListener("keydown",e=>{
  if(!modal.classList.contains("show"))return;
  if(e.key==="Escape")closeModal();
  if(e.key==="ArrowRight"&&mapIdx<SMETA.length-1)openStation(mapIdx+1);
  if(e.key==="ArrowLeft"&&mapIdx>0)openStation(mapIdx-1);
});

function showMap(){reset();view="map";viewEx.classList.add("hidden");viewMap.classList.remove("hidden");viewVid.classList.add("hidden");discEx.classList.add("hidden");markMenu("__map");window.scrollTo({top:0,behavior:"smooth"});}
function showVideos(){reset();view="vid";viewEx.classList.add("hidden");viewMap.classList.add("hidden");viewVid.classList.remove("hidden");discEx.classList.add("hidden");markMenu("__vid");window.scrollTo({top:0,behavior:"smooth"});}
function showEx(){view="ex";viewMap.classList.add("hidden");viewVid.classList.add("hidden");viewEx.classList.remove("hidden");discEx.classList.remove("hidden");}

/* ── gyakorlat ── */
function phases(key){
  return META[key].ph.map(([k,d,li])=>({k:k,d:d,l:T.ex[key].ph[li][0],n:T.ex[key].ph[li][1]||""}));
}
function select(key){
  reset(); showEx(); cur=key;
  const m=META[key];
  totalMs=m.cycles*m.ph.reduce((s,p)=>s+p[1],0)*1000;
  markMenu(key);
  exNameEl.textContent=T.ex[key].name; exBadgeEl.textContent=m.badge;
  cycleEl.textContent=m.cycles+" "+T.ui.rounds+" · ~"+Math.round(totalMs/60000*10)/10+" "+T.ui.min;
  const used=new Set(m.ph.map(p=>p[0]));
  ["in","hold","out","rest"].forEach(k=>{$("c-"+k).style.display=used.has(k)?"":"none";});
  renderDetail(key);
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderDetail(key){
  const e=T.ex[key],m=META[key];
  detailEl.innerHTML='<section class="glass-panel card">'+
   '<p class="eyebrow">'+e.eyebrow+'</p>'+
   '<h3>'+e.name+' <span class="badge">'+m.badge+'</span></h3><p>'+e.desc+'</p>'+
   '<h4>'+T.ui.hWhen+'</h4><div class="slots">'+
     T.ui.slots.map((s,i)=>'<span class="slot'+(m.slots.includes(i)?" on":"")+'">'+s+'</span>').join("")+'</div>'+
   '<p class="daily">'+e.daily+'</p>'+
   '<h4>'+T.ui.hEffect+'</h4><p>'+e.effects+'</p>'+
   '<h4>'+T.ui.hSteps+'</h4><ol>'+e.steps.map(s=>'<li>'+s+'</li>').join("")+'</ol>'+
   '<div class="warn">'+e.warn+'</div>'+
   '<button class="go" id="goBtn">'+T.ui.goStart+'</button></section>';
  $("goBtn").onclick=()=>{$("practice").scrollIntoView({behavior:"smooth"});setTimeout(()=>{if(state==="idle")start();},600);};
}

function setOrbPhase(p,dur){
  orb.className="orb ph-"+p.k;
  ["in","hold","out","rest"].forEach(k=>$("c-"+k).classList.toggle("on",k===p.k));
  const big=(p.k==="in")?"scale(1)":(p.k==="out")?"scale(.44)":null;
  const d=(p.k==="in"||p.k==="out")?dur+"s":"0.35s";
  [core,rim].forEach(el=>{el.style.transitionDuration=d+", 1.1s"; if(big)el.style.transform=big;});
  halo.style.transitionDuration="1.1s, "+d;
  if(big)halo.style.transform=(p.k==="in")?"scale(1.06)":"scale(.7)";
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(22);}catch(e){}}
function runPhase(dur){
  const ps=phases(cur),p=ps[pi],d=(dur!==undefined)?dur:p.d;
  phaseEl.textContent=p.l; noteEl.textContent=p.n;
  cycleEl.textContent=cyc+" / "+META[cur].cycles+" "+T.ui.rounds;
  barFill.style.background="var(--"+PHNAME[p.k]+")";
  if(dur===undefined){setOrbPhase(p,d);buzz();}
  endT=Date.now()+d*1000; countEl.textContent=Math.ceil(d);
  clearInterval(timer);
  timer=setInterval(()=>{
    const rem=endT-Date.now();
    barFill.style.width=Math.min(100,(doneMs+(p.d*1000-Math.max(rem,0)))/totalMs*100)+"%";
    if(rem<=0){doneMs+=p.d*1000;next();return;}
    countEl.textContent=Math.ceil(rem/1000);
  },100);
}
function next(){
  pi++;
  if(pi>=META[cur].ph.length){pi=0;cyc++;if(cyc>META[cur].cycles){finish();return;}}
  runPhase();
}
function start(){
  state="running";pi=0;cyc=1;doneMs=0;
  startBtn.textContent=T.ui.pause; resetBtn.hidden=false; resetBtn.textContent=T.ui.stop;
  [core,rim].forEach(el=>{el.style.transitionDuration="0.4s, 1.1s";el.style.transform="scale(.44)";});
  halo.style.transform="scale(.7)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>runPhase()));
}
function pause(){
  state="paused"; clearInterval(timer); remain=Math.max(endT-Date.now(),0);
  [core,rim,halo].forEach(el=>{const t=getComputedStyle(el).transform;el.style.transition="none";if(t!=="none")el.style.transform=t;});
  startBtn.textContent=T.ui.resume; phaseEl.textContent=T.ui.paused;
}
function resume(){
  state="running";
  const p=phases(cur)[pi],remS=remain/1000;
  startBtn.textContent=T.ui.pause;
  void core.getBoundingClientRect();
  const d=(p.k==="in"||p.k==="out")?remS:0.35;
  [core,rim].forEach(el=>{
    el.style.transition="transform "+d+"s ease-in-out, background 1.1s ease, border-color 1.1s ease";
    if(p.k==="in")el.style.transform="scale(1)"; else if(p.k==="out")el.style.transform="scale(.44)";
  });
  halo.style.transition="background 1.1s ease, transform "+d+"s ease-in-out";
  if(p.k==="in")halo.style.transform="scale(1.06)"; else if(p.k==="out")halo.style.transform="scale(.7)";
  runPhase(remS);
}
function finish(){
  clearInterval(timer); state="idle";
  phaseEl.textContent=T.ui.done; countEl.textContent="✓"; noteEl.textContent=T.ui.doneNote;
  orb.className="orb ph-out";
  [core,rim].forEach(el=>{el.style.transitionDuration="2s, 1.1s";el.style.transform="scale(.44)";});
  halo.style.transform="scale(.7)";
  barFill.style.width="100%"; startBtn.textContent=T.ui.start; resetBtn.hidden=true; buzz();
}
function reset(){
  clearInterval(timer); state="idle"; pi=0; cyc=0; doneMs=0;
  orb.className="orb ph-in";
  [core,rim].forEach(el=>{el.style.transition="transform .4s ease, background 1.1s ease, border-color 1.1s ease";el.style.transform="scale(.44)";});
  halo.style.transition="background 1.1s ease, transform .4s ease"; halo.style.transform="scale(.7)";
  document.querySelectorAll(".pchip").forEach(c=>c.classList.remove("on"));
  barFill.style.width="0%"; barFill.style.background="var(--p-in)";
  countEl.textContent="–"; phaseEl.textContent=T.ui.tapOrb; noteEl.textContent="";
  startBtn.textContent=T.ui.start; resetBtn.hidden=true;
}
function toggle(){if(state==="idle")start();else if(state==="running")pause();else resume();}
startBtn.onclick=toggle; orb.onclick=toggle; resetBtn.onclick=reset;

/* ── teljes újraépítés nyelvváltáskor ── */
function buildAll(){
  document.title=T.ui.title;
  $("menuSub").textContent=T.ui.menuSub;
  $("exH1").textContent=T.ui.exH1; $("exSub").textContent=T.ui.exSub;
  $("mapH1").textContent=T.ui.mapH1; $("mapSub").textContent=T.ui.mapSub;
  $("mapTitle").textContent=T.ui.mapTitle; $("mapLead").textContent=T.ui.mapLead;
  $("mapDisc").textContent=T.ui.mapDisc; $("discEx").textContent=T.ui.disc;
  ["in","hold","out","rest"].forEach(k=>$("l-"+k).textContent=T.ui.ph[k]);
  buildPals(); buildMenu(); buildMap(); buildVideos();
  if(view==="map"){showMap();}
  else if(view==="vid"){showVideos();}
  else {select(cur);}
}
setLang(lang);
</script>
