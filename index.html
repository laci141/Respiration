<!DOCTYPE html>
<html lang="hu" data-pal="naplemente">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respiration — légzőgyakorlatok és a levegő útja</title>
<meta name="description" content="Interaktív légzőgyakorlat-alkalmazás 4 nyelven: 10 technika vezetett időzítővel és a levegő útjának 11 állomása.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root, html[data-pal="naplemente"]{
  --p-in:#F3C6A0; --p-hold:#E2A9AF; --p-out:#A9C4A5; --p-rest:#C0B3CC;
  --bg:#191310;
  --g1:rgba(243,198,160,.20); --g2:rgba(226,169,175,.16); --g3:rgba(169,196,165,.12);
  --ink:#F4E7DA; --ink-dim:#B9A594;
  --tis:#E0A899; --air:#F6E9D9; --art:#DE9096; --ven:#A9A0C6; --acc:#EFC79B;
  --out:rgba(255,240,228,.30); --lbl:rgba(255,240,228,.60);
}
html[data-pal="zsalya"]{
  --p-in:#AFC9B9; --p-hold:#D8CEB5; --p-out:#C3B9CE; --p-rest:#B1BDC5;
  --bg:#16150F;
  --g1:rgba(175,201,185,.17); --g2:rgba(216,206,181,.16); --g3:rgba(195,185,206,.12);
  --ink:#EFEADF; --ink-dim:#AFA997;
  --tis:#CFA79C; --air:#F0EADC; --art:#D2949A; --ven:#A6A2C2; --acc:#D8CEB5;
  --out:rgba(245,242,232,.28); --lbl:rgba(245,242,232,.58);
}
html[data-pal="gyertya"]{
  --p-in:#F6D2A4; --p-hold:#DE9F86; --p-out:#C4837E; --p-rest:#A38879;
  --bg:#1B1209;
  --g1:rgba(246,210,164,.19); --g2:rgba(222,159,134,.16); --g3:rgba(163,136,121,.12);
  --ink:#F6E6D2; --ink-dim:#BCA48B;
  --tis:#D89C89; --air:#F7E8D3; --art:#D08B84; --ven:#B08E86; --acc:#F0C48A;
  --out:rgba(255,236,214,.30); --lbl:rgba(255,236,214,.60);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; min-height:100vh; background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background .5s ease, color .5s ease}
body::before{content:""; position:fixed; inset:0; z-index:-1; transition:background .5s ease;
  background:
    radial-gradient(680px 460px at 14% 18%, var(--g1), transparent 62%),
    radial-gradient(760px 520px at 86% 28%, var(--g2), transparent 62%),
    radial-gradient(660px 620px at 48% 92%, var(--g3), transparent 62%),
    var(--bg)}

.glass-panel{
  background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.10); border-radius:20px;
  backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
  box-shadow:0 18px 50px -18px rgba(0,0,0,.75); padding:24px 22px; color:var(--ink)}
@media (max-width:600px){
  .glass-panel{border-radius:16px; backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px);
    box-shadow:0 12px 32px -14px rgba(0,0,0,.7); padding:18px 16px}
}

.layout{display:flex; gap:22px; max-width:1140px; margin:0 auto; padding:26px 16px 64px; align-items:flex-start}
main{flex:1; min-width:0; max-width:800px; margin:0 auto}

.menu{width:246px; flex:0 0 246px; position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto; padding:20px 14px}
.menu-title{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.28rem; margin:2px 8px 2px; letter-spacing:-.01em}
.menu-sub{font-size:.74rem; color:var(--ink-dim); margin:0 8px 12px}
.langbar{display:flex; gap:4px; margin:0 6px 8px}
.langbar button{flex:1; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--ink-dim);
  border-radius:9px; padding:6px 0; font-size:.72rem; font-family:"IBM Plex Mono",monospace; font-weight:600; cursor:pointer; transition:all .18s}
.langbar button:hover{background:rgba(255,255,255,.09)}
.langbar button.on{color:var(--ink); background:color-mix(in srgb,var(--p-in) 20%,transparent); border-color:color-mix(in srgb,var(--p-in) 55%,transparent)}
.menu-group{font-size:.67rem; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-dim); margin:17px 8px 6px}
.menu-item{display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; color:var(--ink);
  font-size:.9rem; font-family:inherit; text-align:left; cursor:pointer; padding:9px 10px; border-radius:11px; transition:background .18s}
.menu-item:hover{background:rgba(255,255,255,.06)}
.menu-item.active{background:color-mix(in srgb, var(--mi) 20%, transparent); outline:1px solid color-mix(in srgb, var(--mi) 55%, transparent)}
.dot{width:9px; height:9px; border-radius:50%; background:var(--mi); flex:0 0 auto; box-shadow:0 0 9px color-mix(in srgb, var(--mi) 70%, transparent)}
.dot.sq{border-radius:3px; transform:rotate(45deg)}

#menuBtn{display:none}
.backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; opacity:0; pointer-events:none; transition:opacity .25s}
.backdrop.show{opacity:1; pointer-events:auto}
@media (max-width:900px){
  .menu{position:fixed; top:0; left:0; bottom:0; z-index:40; width:268px; max-height:none; border-radius:0 18px 18px 0; transform:translateX(-106%); transition:transform .3s ease}
  .menu.open{transform:none}
  #menuBtn{display:grid; place-items:center; position:fixed; top:12px; left:12px; z-index:20; width:42px; height:42px; border-radius:13px; cursor:pointer;
    background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px); font-size:1.15rem}
  .layout{padding-top:14px} header{padding-top:40px}
}

header{text-align:center; margin-bottom:22px}
h1{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:clamp(1.7rem,5.2vw,2.4rem); margin:0 0 6px; letter-spacing:-.015em}
.sub{color:var(--ink-dim); font-size:.94rem; margin:0}

.palbar{margin-bottom:18px}
.palbar h3{font-size:.7rem; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-dim); margin:0 0 10px; font-weight:600}
.pals{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px}
.pal{border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.035); border-radius:14px;
  padding:11px 12px; cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); transition:border-color .2s, background .2s}
.pal:hover{background:rgba(255,255,255,.07)}
.pal.on{border-color:color-mix(in srgb,var(--p-in) 65%,transparent); background:color-mix(in srgb,var(--p-in) 12%,transparent)}
.pal b{display:block; font-size:.88rem; font-weight:600; margin-bottom:2px}
.pal em{display:block; font-style:normal; font-size:.72rem; color:var(--ink-dim); margin-bottom:8px}
.sw{display:flex; gap:5px}
.sw i{flex:1; height:20px; border-radius:6px; display:block}
.palnote{font-size:.78rem; color:var(--ink-dim); margin:11px 0 0}

.practice{text-align:center; margin-bottom:22px}
.orb{position:relative; width:min(270px,68vw); aspect-ratio:1; margin:18px auto 6px; display:grid; place-items:center;
  cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; --now:var(--p-in)}
.orb.ph-in{--now:var(--p-in)} .orb.ph-hold{--now:var(--p-hold)}
.orb.ph-out{--now:var(--p-out)} .orb.ph-rest{--now:var(--p-rest)}
.halo{position:absolute; inset:-24%; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, color-mix(in srgb,var(--now) 38%,transparent) 0%, color-mix(in srgb,var(--now) 12%,transparent) 42%, transparent 68%);
  filter:blur(34px); transition:background 1.1s ease, transform 4s ease-in-out; transform:scale(.7)}
.orb-core{position:absolute; inset:11%; border-radius:50%; pointer-events:none;
  background:
    radial-gradient(circle at 37% 30%, rgba(255,255,255,.46), transparent 44%),
    radial-gradient(circle at 46% 42%, color-mix(in srgb,var(--now) 82%, #fff 12%) 0%,
                    color-mix(in srgb,var(--now) 36%, transparent) 56%, transparent 78%);
  filter:blur(7px); transform:scale(.44); transition:transform 4s ease-in-out, background 1.1s ease}
.orb-rim{position:absolute; inset:11%; border-radius:50%; pointer-events:none;
  border:1px solid color-mix(in srgb,var(--now) 26%,transparent);
  transform:scale(.44); transition:transform 4s ease-in-out, border-color 1.1s ease}
.orb.ph-hold .orb-core,.orb.ph-rest .orb-core{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{filter:blur(9px) brightness(1.12)}}
.orb-text{position:relative; z-index:1; pointer-events:none}
.count{font-family:"Fraunces",Georgia,serif; font-size:2.8rem; font-weight:600; line-height:1; display:block; color:var(--ink)}
.phase{font-size:1rem; margin-top:6px; display:block; color:color-mix(in srgb,var(--now) 72%, var(--ink))}
.note{font-size:.8rem; color:var(--ink-dim); min-height:1.2em; margin:4px 0 0}
.phases{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:14px 0 10px}
.pchip{display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--ink-dim);
  border:1px solid rgba(255,255,255,.10); border-radius:999px; padding:4px 10px; transition:all .25s}
.pchip i{width:9px; height:9px; border-radius:50%; background:var(--pc); box-shadow:0 0 8px color-mix(in srgb,var(--pc) 60%,transparent)}
.pchip.on{color:var(--ink); border-color:color-mix(in srgb,var(--pc) 55%,transparent); background:color-mix(in srgb,var(--pc) 14%,transparent)}
.meta{color:var(--ink-dim); font-size:.85rem; margin:2px 0 10px}
.bar{height:4px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; max-width:320px; margin:0 auto 16px}
.bar i{display:block; height:100%; width:0%; background:var(--p-in); border-radius:99px; transition:width .2s linear, background .6s}
.btn{border:1px solid color-mix(in srgb,var(--p-in) 60%,transparent); background:color-mix(in srgb,var(--p-in) 18%,transparent); color:var(--ink);
  border-radius:12px; padding:11px 28px; font-size:1rem; font-family:inherit; cursor:pointer; transition:background .2s}
.btn:hover{background:color-mix(in srgb,var(--p-in) 30%,transparent)}
.btn-ghost{border:none; background:none; color:var(--ink-dim); font-size:.86rem; font-family:inherit; cursor:pointer; padding:10px 12px}
.btn-ghost:hover{color:var(--ink)}
@media (prefers-reduced-motion: reduce){
  .orb-core,.orb-rim,.halo{transition:none !important}
  .orb.ph-hold .orb-core,.orb.ph-rest .orb-core,.flowdot{animation:none !important}
}

.card{margin-bottom:16px}
.eyebrow{font-size:.71rem; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-dim); margin:0 0 5px}
.card h3{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.3rem; margin:0 0 2px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.badge{font-family:"IBM Plex Mono",monospace; font-size:.7rem; font-weight:600; border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:3px 9px; color:var(--ink-dim)}
.card p{margin:8px 0; font-size:.93rem}
.card h4{font-size:.77rem; text-transform:uppercase; letter-spacing:.11em; color:var(--ink-dim); margin:16px 0 7px}
.slots{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:8px}
.slot{font-size:.8rem; padding:5px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.13); color:var(--ink-dim); opacity:.5}
.slot.on{opacity:1; color:var(--ink); background:color-mix(in srgb,var(--p-in) 18%,transparent); border-color:color-mix(in srgb,var(--p-in) 55%,transparent)}
.daily{font-size:.9rem; margin:4px 0 0}
.card ol{margin:0; padding-left:20px; font-size:.93rem}
.card ol li{margin-bottom:5px}
.warn{border-left:3px solid color-mix(in srgb,var(--acc) 75%,transparent); background:color-mix(in srgb,var(--acc) 8%,transparent);
  border-radius:0 10px 10px 0; padding:8px 12px; font-size:.86rem; margin-top:14px}
.go{margin-top:16px; display:inline-block; cursor:pointer; border:1px solid color-mix(in srgb,var(--p-in) 55%,transparent);
  background:color-mix(in srgb,var(--p-in) 14%,transparent); color:var(--ink); border-radius:11px; padding:9px 18px; font-size:.9rem; font-family:inherit}

.map-intro{margin-bottom:20px}
.map-intro h2{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.5rem; margin:0 0 8px}
.map-intro p{font-size:.93rem; margin:8px 0 0}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:.78rem; color:var(--ink-dim)}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:16px; height:3px; border-radius:2px; display:block}
.track{position:relative; padding-left:44px}
.spine{position:absolute; left:17px; top:6px; bottom:6px; width:2px; border-radius:2px; opacity:.55;
  background:linear-gradient(180deg,var(--p-in) 0%,var(--p-out) 30%,var(--art) 50%,var(--acc) 68%,var(--ven) 86%,var(--p-in) 100%)}
.flowdot{position:absolute; left:12px; width:12px; height:12px; border-radius:50%; filter:blur(1px);
  background:radial-gradient(circle at 40% 35%, #fff, var(--p-in) 62%, transparent 76%);
  animation:flow 9s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes flow{0%{top:0;opacity:0}6%{opacity:1}94%{opacity:1}100%{top:100%;opacity:0}}
@media (max-width:600px){.track{padding-left:36px}.spine{left:13px}.flowdot{left:8px}}
.station{position:relative; width:100%; text-align:left; margin-bottom:12px; cursor:pointer; font-family:inherit;
  border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:15px 16px; color:var(--ink);
  background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.045));
  backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
  box-shadow:0 18px 50px -22px rgba(0,0,0,.75);
  transition:transform .18s ease, border-color .18s; display:flex; gap:13px; align-items:flex-start}
.station:hover{transform:translateX(3px); border-color:color-mix(in srgb,var(--sa) 55%,transparent)}
.station::before{content:""; position:absolute; left:-32px; top:22px; width:13px; height:13px; border-radius:50%;
  background:var(--bg); border:2.5px solid var(--sa); box-shadow:0 0 10px color-mix(in srgb,var(--sa) 60%,transparent)}
@media (max-width:600px){
  .station{padding:13px; border-radius:16px; backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px)}
  .station::before{left:-27px; width:11px; height:11px; top:19px}
}
.st-ico{flex:0 0 auto; width:46px; height:46px; border-radius:13px; display:grid; place-items:center;
  background:color-mix(in srgb,var(--sa) 15%,transparent); border:1px solid color-mix(in srgb,var(--sa) 32%,transparent)}
.st-ico svg{width:26px; height:26px}
.st-body{min-width:0; flex:1}
.st-top{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.st-num{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--sa); font-weight:600}
.st-name{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.08rem}
.st-phase{font-size:.65rem; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-dim)}
.st-short{font-size:.86rem; color:var(--ink-dim); margin:4px 0 0; display:block}
.st-open{font-size:.74rem; color:var(--sa); margin-top:7px; display:inline-block}

.modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:16px}
.modal.show{display:flex}
.modal-bg{position:absolute; inset:0; background:color-mix(in srgb,var(--bg) 78%, transparent); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px)}
.modal-box{position:relative; width:100%; max-width:690px; max-height:92vh; overflow-y:auto; padding:26px 24px 24px;
  animation:pop .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@media (max-width:600px){.modal{padding:8px}.modal-box{padding:20px 15px; max-height:95vh}}
.m-close{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:11px; cursor:pointer; z-index:2;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:var(--ink); font-size:1rem; line-height:1}
.m-eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--sa); margin:0 0 4px}
.m-title{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.55rem; margin:0 0 3px; padding-right:38px}
.m-tag{font-size:.85rem; color:var(--ink-dim); margin:0 0 16px}
.dia-wrap{border:1px solid rgba(255,255,255,.09); border-radius:15px; background:color-mix(in srgb,var(--bg) 55%, transparent); padding:10px; margin-bottom:8px}
.dia{width:100%; height:auto; display:block}
.diacap{font-size:.76rem; color:var(--ink-dim); margin:0 0 18px; padding:0 4px; text-align:center}
.m-h{font-size:.74rem; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-dim); margin:18px 0 7px}
.m-p{font-size:.93rem; margin:8px 0}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:9px; margin-top:8px}
.stat{border:1px solid rgba(255,255,255,.09); border-radius:12px; padding:10px 12px; background:rgba(255,255,255,.035)}
.stat b{display:block; font-family:"IBM Plex Mono",monospace; font-size:1rem; font-weight:600; color:var(--sa)}
.stat span{display:block; font-size:.76rem; color:var(--ink-dim); margin-top:2px; line-height:1.35}
.tiein{border-left:3px solid var(--sa); background:color-mix(in srgb,var(--sa) 9%,transparent);
  border-radius:0 12px 12px 0; padding:11px 14px; font-size:.88rem; margin-top:18px}
.tiein b{font-size:.71rem; text-transform:uppercase; letter-spacing:.11em; color:var(--sa); display:block; margin-bottom:4px}
.jump{cursor:pointer; font-family:inherit}
.m-nav{display:flex; justify-content:space-between; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid rgba(255,255,255,.08)}
.m-nav button{flex:1; border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.045); color:var(--ink);
  border-radius:11px; padding:10px 12px; font-size:.83rem; font-family:inherit; cursor:pointer}
.m-nav button:hover:not(:disabled){background:rgba(255,255,255,.09)}
.m-nav button:disabled{opacity:.3; cursor:default}
.disclaimer{margin-top:26px; font-size:.82rem; color:var(--ink-dim); text-align:center; padding:0 10px}
.hidden{display:none}

/* ══ Videók ══ */
.vid-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); margin-top:6px}
.vid-card{background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:14px;
  backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
  box-shadow:0 18px 50px -22px rgba(0,0,0,.75)}
.vid-wrap{position:relative; width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:rgba(0,0,0,.35)}
.vid-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.vid-ph{position:absolute; inset:0; display:grid; place-items:center; color:var(--ink-dim);
  font-family:"IBM Plex Mono",monospace; font-size:.82rem; letter-spacing:.35em}
.vid-title{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.02rem; margin:11px 4px 2px; color:var(--ink)}
.vid-title.ph{color:var(--ink-dim); letter-spacing:.28em}
@media (max-width:600px){.vid-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="mAir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--p-in)"/></marker>
  <marker id="mArt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--art)"/></marker>
  <marker id="mVen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ven)"/></marker>
  <marker id="mAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--acc)"/></marker>
  <marker id="mDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--lbl)"/></marker>
</defs></svg>

<button id="menuBtn" aria-label="Menu">☰</button>
<div class="backdrop" id="backdrop"></div>

<div class="layout">
<aside class="menu glass-panel" id="menu">
  <p class="menu-title">Respiration</p>
  <p class="menu-sub" id="menuSub"></p>
  <div class="langbar" id="langbar"></div>
  <nav id="nav"></nav>
</aside>

<main>
  <section class="glass-panel palbar">
    <h3 id="palTitle"></h3>
    <div class="pals" id="pals"></div>
    <p class="palnote" id="palnote"></p>
  </section>

  <div id="viewEx">
    <header><h1 id="exH1"></h1><p class="sub" id="exSub"></p></header>
    <section class="glass-panel practice" id="practice">
      <div class="orb" id="orb">
        <div class="halo" id="halo"></div>
        <div class="orb-core" id="orbCore"></div>
        <div class="orb-rim" id="orbRim"></div>
        <div class="orb-text"><span class="count" id="count">–</span><span class="phase" id="phase"></span></div>
      </div>
      <p class="note" id="note"></p>
      <div class="phases">
        <span class="pchip" id="c-in"   style="--pc:var(--p-in)"><i></i><span id="l-in"></span></span>
        <span class="pchip" id="c-hold" style="--pc:var(--p-hold)"><i></i><span id="l-hold"></span></span>
        <span class="pchip" id="c-out"  style="--pc:var(--p-out)"><i></i><span id="l-out"></span></span>
        <span class="pchip" id="c-rest" style="--pc:var(--p-rest)"><i></i><span id="l-rest"></span></span>
      </div>
      <p class="meta"><span id="exName"></span> · <span id="exBadge"></span> · <span id="cycleInfo"></span></p>
      <div class="bar"><i id="barFill"></i></div>
      <button class="btn" id="startBtn"></button>
      <button class="btn-ghost" id="resetBtn" hidden></button>
    </section>
    <div id="detail"></div>
  </div>

  <div id="viewMap" class="hidden">
    <header><h1 id="mapH1"></h1><p class="sub" id="mapSub"></p></header>
    <section class="glass-panel map-intro">
      <h2 id="mapTitle"></h2><p id="mapLead"></p>
      <div class="legend" id="mapLegend"></div>
    </section>
    <div class="track" id="track"><div class="spine"></div><div class="flowdot"></div></div>
    <p class="disclaimer" id="mapDisc"></p>
  </div>

  <div id="viewVid" class="hidden">
    <header><h1 id="vidH1"></h1><p class="sub" id="vidSub"></p></header>
    <section class="glass-panel map-intro">
      <h2 id="vidTitle"></h2><p id="vidLead"></p>
    </section>
    <div class="vid-grid" id="vidGrid"></div>
    <p class="disclaimer" id="vidDisc"></p>
  </div>

  <p class="disclaimer" id="discEx"></p>
</main>
</div>

<div class="modal" id="modal">
  <div class="modal-bg" id="modalBg"></div>
  <div class="glass-panel modal-box" id="modalBox">

</div>

 ph:[["Erős kilégzés","has berántva"],["Passzív belégzés","a has ellazul"],["Mély belégzés",""],["Lassú kilégzés",""],["Pihenő","lélegezz természetesen"]]},
tummo:{name:"Tummo – belső tűz",eyebrow:"Tibeti szerzetesek · Naropa hat jógája, 8. század",
 desc:"A himalájai szerzetesek belső tűz gyakorlata: erőteljes hasi légzés + a köldök mögé képzelt láng vizualizációja. Harvard-kutatók (Benson, 1982) mérték, hogy gyakorlott szerzetesek a végtagjaik hőmérsékletét akár 8 °C-kal tudják emelni vele.",
 daily:"Napi 1×, 3 kör, ébredés után üres gyomorra. Este kerüld – felpörget.",
 effects:"Energetizál és melegít (a barna zsírszövetet is aktiválja), javítja a hidegtűrést, mély meditatív állapotba visz.",
 steps:["Ülj kényelmesen, egyenes gerinccel, kezed a hasadon. Ez az egyszerűsített, világi változat.","Képzelj el egy kis lángot a köldököd mögött, ami minden lélegzettel erősödik.","Mély, gyors belégzés az orron a hasba, majd erőteljes kilégzés a szájon.","Ismételd 15-ször ebben a ritmusban.","Az utolsó kilégzés után maradj üres tüdővel, ameddig kényelmes.","Mély belégzés, tartsd bent 4–5 másodpercig, majd lassú kilégzés."],
 warn:"SOHA ne csináld vízben, vezetés közben vagy állva – a légzésvisszatartás ájulást okozhat. Szívbetegség, epilepszia, terhesség esetén hagyd ki.",
 ph:[["Gyors belégzés a hasba","a láng erősödik a köldöknél"],["Erős kilégzés",""],["Maradj üres tüdővel","ameddig kényelmes – ha kell, lélegezz"],["Mély belégzés",""],["Tartsd bent – a hő szétárad",""],["Lassú kilégzés",""]]},
wimhof:{name:"Wim Hof légzés",eyebrow:"Wim Hof · a tummo világi változata",
 desc:"30 mély, ritmusos légzés (enyhe szándékos túllégzés), majd kilégzés utáni visszatartás, végül egy 15 másodperces helyreállító belégzéstartás. Kísérletben kimutatták, hogy gyakorlói befolyásolni tudták az immunválaszukat.",
 daily:"Napi 1×, 3–4 kör, ébredés után üres gyomorra – mindig ülve vagy fekve.",
 effects:"Energia- és fókuszlöket, stressztűrés javulása, kutatott immunmoduláló és gyulladáscsökkentő hatás.",
 steps:["Ülj vagy feküdj biztonságos, kényelmes helyen.","30 mély, gyors belégzés a hasba és mellkasba, laza, nem teljes kilégzésekkel.","Bizsergés, enyhe szédülés normális – ezért soha ne állva.","Az utolsó kilégzés után maradj üres tüdővel, ameddig kényelmes (nem verseny!).","Utána mély belégzés, tartsd bent 15 másodpercig, majd engedd el."],
 warn:"SOHA ne csináld vízben, kádban, zuhany alatt, vezetés közben vagy állva – ájulásveszély! Szívbetegség, epilepszia, terhesség esetén hagyd ki.",
 ph:[["Mély belégzés",""],["Laza kilégzés",""],["Kilégzés után tartsd","ameddig kényelmes – bármikor lélegezhetsz"],["Mély belégzés",""],["Tartsd bent",""],["Engedd el",""]]}
},
map:[
{name:"Orr",phase:"Belégzés",tag:"Szűrő, fűtés, párásító – és egy gázgyár",
 short:"A levegő megszűrődik, testhőmérsékletre melegszik és telítődik nedvességgel.",
 cap:"Fej hosszmetszete oldalról. A levegő balról lép be, a három orrkagyló örvényre kényszeríti, majd a garat felé fordul lefelé.",
 what:"Az orrüreg falából három csontos polc, az orrkagylók nyúlnak be – a rajzon a három felfelé kunkorodó nyelv. Ezek örvénylésre kényszerítik a levegőt, így az sokkal nagyobb felületen érintkezik a nedves, jól átvérzett nyálkahártyával. Néhány centiméter alatt a belélegzett levegő testhőmérsékletűre melegszik, a főhörgőkig gyakorlatilag telítetté válik párával, a nagyobb szemcsék pedig fennakadnak a nyákrétegen. Ha szájon lélegzel, ez az egész előkészítés kimarad, és a szárazabb levegő terhét a légcső nyálkahártyája viseli.",
 sci:"Az orrmelléküregek – a rajzon a homlok, az arccsont és a koponya mélyén lévő három üreg – folyamatosan nitrogén-monoxidot (NO) termelnek, ami belégzéskor lesodródik a tüdőbe. A NO értágító és hörgőtágító hatású, javítja a tüdő szellőzés–véráramlás összhangját, és vírus- meg baktériumölő tulajdonsága is van. Mérések szerint orron át lélegezve a bőrön mért oxigénnyomás nagyjából 10%-kal magasabb, mint szájlégzésnél.",
 tie:"Ezért kezdődik szinte minden technika azzal, hogy belégzés az orron. A méhzümmögés külön is ide tartozik: a zümmögés rezgése sokszorosára emeli a melléküregekből kiáramló NO mennyiségét.",
 sl:["ennyire melegszik a levegő","páratartalom a főhörgőknél","a párát az orr adja hozzá"],exs:["nadi","bhramari"],
 d:["orrkagylók (3 db)","por, pollen fennakad","melléküregek","garat felé","nyálkahártya","levegő"]},
{name:"Gége és légcső",phase:"Belégzés",tag:"Patkó alakú porcgyűrűk és egy nyák-mozgólépcső",
 short:"Kb. 11 cm-es cső, amit porcgyűrűk tartanak nyitva, belül önmagát takarítja.",
 cap:"Balra a légcső elölnézete a porcgyűrűkkel és a kettéágazással; jobbra a fal kinagyítva: nyákréteg, csillószőrök, kehelysejtek.",
 what:"A gégén áthaladva a levegő a légcsőbe ér: ez egy kb. 10–12 cm hosszú cső, amit hátul nyitott, patkó alakú porcgyűrűk feszítenek. Azért nem teljes körök, hogy a mögötte futó nyelőcső ki tudjon tágulni, amikor nyelsz. A cső alján, a carinánál válik két főhörgőre; a jobb oldali vastagabb és meredekebben indul, ezért kerül oda gyakrabban a félrenyelt falat. A légcső belsejét csillós hám béleli: milliónyi mikroszkopikus szőrszál egy vékony nyákréteget tol felfelé, a torok irányába. A kinagyított részleten a szőrszálak közt ülő kehelysejtek termelik magát a nyákot.",
 sci:"A csillók összehangoltan, hullámszerűen csapnak, és a mozgásukat többek között az orrban termelt nitrogén-monoxid is szabályozza. Ha a levegő túl száraz – például szájlégzésnél –, a nyák besűrűsödik és a mozgólépcső lelassul. A dohányfüst pedig igazoltan rontja ezt a tisztító mechanizmust.",
 tie:"Az ujjayi (óceánlégzés) éppen itt, a gégénél szűkíti kissé a rést – a keletkező halk moraj hallható visszajelzés arról, hogy egyenletes-e a légáramod.",
 sl:["a légcső hossza","patkó alakú porcgyűrű","itt kezdődik a légutak számozása"],exs:["ujjayi"],
 d:["csillószőrök","nyákréteg","kehelysejtek","a kosz felfelé halad","gége","légcső","bal főhörgő","jobb főhörgő","nyelőcső","carina"]},
{name:"Hörgők és hörgőcskék",phase:"Belégzés",tag:"23 elágazás, egy fejjel lefelé fordított fa",
 short:"A cső kettéágazik, majd újra és újra – összesen kb. 23 nemzedéken át.",
 cap:"A két tüdő körvonala a lebenyekkel, benne a hörgőfa. A jobb tüdő 3, a bal 2 lebenyű – a bal oldalon a szívnek is helyet kell hagyni.",
 what:"A légcső két főhörgőre válik, majd minden ág újra kettéoszlik. Az átlagos út a légcsőtől a tüdő széléig körülbelül 23 ilyen elágazást jelent, de a valóságban ez nem szabályos: a rajzon is látszik, hogy az ágak eltérő hosszúak és vastagságúak – ezt hívják szabálytalan kettéosztódásnak. Az első 16 nemzedék pusztán szállít, itt még nincs gázcsere. A 17. elágazástól kezdve a falban már megjelennek az első léghólyagocskák, és innentől a levegő minden lépésnél lassabban áramlik, míg végül a mozgatást átveszi a puszta diffúzió.",
 sci:"Minden osztódásnál az ágak összesített keresztmetszete nő, így a levegő sebessége drámaian lecsökken. A legkisebb hörgőcskéknek már nincs porcvázuk, csak simaizom-gyűrűjük – ezek szűkülnek görcsösen asztmás rohamban. A vezető zóna térfogata a holttér: kb. 150 ml, ami minden lélegzetnél elvész a gázcsere szempontjából.",
 tie:"Ezért hatékonyabb egy lassú, mély lélegzet, mint két kapkodó: a holttér ugyanannyi, de nagyobb lélegzetnél arányaiban sokkal kevesebb vész el belőle.",
 sl:["elágazás-nemzedék","csak szállít (vezető zóna)","már gázt is cserél"],exs:["belly","koherens"],
 d:["légcső","főhörgők","lebenyhörgők","itt kezdődik a gázcsere","jobb tüdő · 3 lebeny","bal tüdő · 2 lebeny","szív helye"]},
{name:"Léghólyagocskák",phase:"Gázcsere",tag:"Fél teniszpálya, összehajtva a mellkasodba",
 short:"Több száz millió parányi hólyag, amiket sűrű hajszálérháló sző be.",
 cap:"Balra egy alveoláris zsák a hajszálérhálóval, benne haladó vörösvértestekkel. Jobbra a fal keresztmetszete rétegenként.",
 what:"A legvégső ágak fürtökben végződnek: ezek a léghólyagocskák, vagyis alveolusok. A rajzon szándékosan sokszög alakúak, mert a valóságban nem gömbök – szorosan egymáshoz préselődve méhsejtszerű falakon osztoznak. Egyenként csak ötödmilliméteresek, és több százmillió van belőlük. Ha kiteregetnéd őket, a felületük egy fél teniszpályát borítana be. Mindegyiket sűrű hajszálérháló fonja körül, amiben a vörösvértestek libasorban haladnak. A jobb oldali keresztmetszet mutatja, milyen vékony a válaszfal: a levegő felől egy zsírfilm, egy lapos hámsejt, egy közös alaphártya, egy érfalsejt – és már a vérben vagy.",
 sci:"A hólyagocskák belsejét felületaktív anyag, surfactant vonja be – ez akadályozza meg, hogy kilégzéskor a parányi hólyagok összetapadjanak. Tüdőtágulatban (emfizémában) a falak elbomlanak és a hólyagok kevesebb, nagyobb üreggé olvadnak össze: drasztikusan csökken a felület. Tüdőfibrózisban fordítva, a fal vastagszik meg, és így lassul a gázok átjutása.",
 tie:"A mély, hasi belégzés az alsó tüdőlebenyeket is megnyitja – ott a legsűrűbb a hajszálérháló, tehát ott a leghatékonyabb a gázcsere. A felszínes mellkasi légzés ezt a területet jórészt kihagyja.",
 sl:["léghólyagocska összesen","gázcserélő felület","a levegő-vér válaszfal"],exs:["belly","koherens"],
 d:["levegő","surfactant film","hámsejt","alaphártya","érfal sejtje","vér + vörösvértest","0,5–1 µm a teljes fal","hörgőcske","léghólyagok","hajszálérháló","a vér 0,75 s-ig van itt – a csere 0,25 s alatt kész"]},
{name:"Maga a gázcsere",phase:"Gázcsere",tag:"Semmi szivattyú – csak nyomáskülönbség",
 short:"Az oxigén és a szén-dioxid magától vándorol, a nagyobb nyomás felől a kisebb felé.",
 cap:"A válaszfal két oldala. Az O₂ (két összekapcsolt golyó) balról jobbra, a CO₂ (három golyó) jobbról balra vándorol, mindkettő a saját nyomáslejtőjén.",
 what:"Itt nincs pumpa és nincs aktív szállítás: minden gáz onnan megy oda, ahol nagyobb a saját nyomása, arra, ahol kisebb. A léghólyagban az oxigén nyomása kb. 100 Hgmm, a beérkező vérben csak 40 – ez a hatvanas különbség hajtja az oxigént befelé, ahol a vörösvértestben azonnal fel is veszi a hemoglobin. A szén-dioxidnál a különbség csak 5 Hgmm, viszont a CO₂ nagyjából hússzor gyorsabban oldódik és halad át a falon, így ez a pici lejtő is bőven elég.",
 sci:"Nyugalomban a vörösvértest kb. 0,75 másodpercet tölt a hajszálérben, de a kiegyenlítődés már az út harmadánál megtörténik – vagyis háromszoros biztonsági tartalék van. Ezért nem a diffúzió, hanem a véráramlás a szűk keresztmetszet: ezt hívják perfúzió-limitált cserének.",
 tie:"Innen látszik, miért nem old meg semmit a kapkodó légzés: a vér már így is telítetté válik. Amit a lassú légzés javít, az a szellőzés és a véráramlás jobb összehangolása a tüdő egészében.",
 sl:["O₂ nyomáslejtő, Hgmm","CO₂ nyomáslejtő, Hgmm","alatt kiegyenlítődik"],exs:["koherens","box"],
 d:["LÉGHÓLYAG","HAJSZÁLÉR","fal","a hemoglobin felveszi","a kifújt levegőbe"]},
{name:"Vér és hemoglobin",phase:"O₂-szállítás",tag:"Négy vasatom, négy ülőhely az oxigénnek",
 short:"Az oxigén rosszul oldódik a vérben – ezért taxira, hemoglobinra száll fel.",
 cap:"Balra a vörösvértest korong alakja a behúzott közepével, benne a hemoglobin négy alegysége. Jobbra a telítési görbe: az S alak a kooperatív kötés jele.",
 what:"Az oxigén rosszul oldódik vízben, így a vérplazmában alig fér el belőle valami. A megoldás a hemoglobin: egy négy alegységből álló fehérje a vörösvértestek belsejében – két alfa és két béta lánc –, mindegyik közepén egy lapos hem-koronggal, aminek a szívében egy vasatom ül. Egy vas egy oxigénmolekulát köt meg, tehát egy hemoglobin négyet szállít. A szállított oxigén 98,5%-a így utazik, mindössze 1,5% oldódik szabadon a plazmában. A vörösvértestnek épp azért nincs sejtmagja és lapos a közepe, hogy minél több hemoglobin férjen bele.",
 sci:"A megkötés nem egyenletes: ahogy az első oxigén beköt, a fehérje alakot vált, és a másodikat, harmadikat már könnyebben fogadja. Ez a kooperatív kötés, és ettől S alakú a jobb oldali telítési görbe. A görbe felső, lapos szakasza a tüdő: itt még nagy nyomásesés is alig csökkenti a telítettséget. A meredek középső szakasz a szövet: itt egy kis nyomásesés is rengeteg oxigén leadását váltja ki. Savasabb, melegebb, CO₂-ban gazdagabb környezetben a görbe jobbra tolódik – ez a Bohr-hatás.",
 tie:"Ez magyarázza, miért nem tesz jót a túllégzés: a görbe teteje lapos, a véred nyugalomban már 97–99%-on áll. Ami valóban változik gyors légzésnél, az a szén-dioxid szintje.",
 sl:["O₂ egy hemoglobinon","hemoglobinhoz kötve","alatt telítődik a sejt"],exs:["wimhof","koherens"],
 d:["O₂ molekula","hem + vasatom","vörösvértest · 4 kötőhely","telítettség","szövet","tüdő","O₂ nyomás →","meredek szakasz:","itt adja le az O₂-t"]},
{name:"Szív és artériák",phase:"O₂-szállítás",tag:"Bal szívfél: a nagy nyomású szivattyú",
 short:"A tüdőből visszatérő, oxigéndús vér a bal szívfélen át indul a testbe.",
 cap:"A szív négy ürege metszetben. Lila a CO₂-dús, rózsaszín az oxigéndús oldal; a rövid vonalak a billentyűk.",
 what:"A frissen oxigéndús vér a tüdővénákon át a bal pitvarba érkezik, onnan a billentyűn keresztül a bal kamrába, ami a test legerősebb izmos szivattyúja – a rajzon jól látszik, hogy a fala jóval vastagabb, mint a jobb oldalé. Innen indul az aortába, majd egyre kisebb artériákon át el a hajszálerekig. A jobb oldal ugyanannyi vért mozgat, de csak a tüdőig, sokkal kisebb nyomással. Nyugalomban a szív percenként nagyjából öt liter vért mozgat meg, és egy vörösvértest teljes körútja kevesebb mint egy perc.",
 sci:"A tüdő- és a testkeringés sorba van kapcsolva, ezért a két szívfél ugyanannyi vért mozgat, csak nagyon eltérő nyomáson. Belégzéskor a mellkasban csökkenő nyomás több vért szív vissza a szívbe – ezért gyorsul a pulzusod belégzésnél, és lassul kilégzésnél.",
 tie:"Ez a pulzus-hullámzás a légzési szinuszaritmia, a szívritmus-variabilitás alapja. Ezért mérhető a lassú légzés hatása közvetlenül a szíven.",
 sl:["nyugalmi perctérfogat","egy teljes körút","artériás O₂-nyomás"],exs:["koherens","box"],
 d:["jobb","bal","pitvar","felső fővéna","alsó fővéna","tüdőverőér","AORTA","tüdővénák","szövetek, hajszálerek","kamra","~5 l/perc","nyugalmi perctérfogat","a bal kamra fala","háromszor vastagabb"]},
{name:"A sejt és a mitokondrium",phase:"Sejt",tag:"Az út vége: itt válik a levegő energiává",
 short:"Az oxigén a sejt erőműveiben zárja le az energiatermelő láncot.",
 cap:"Mitokondrium metszete. A belső membrán redőin ül a négy komplex és az ATP-szintáz; a protonok kifelé pumpálódnak, majd az ATP-szintázon át visszazúdulnak.",
 what:"A hajszálerekben az oxigén kilép a vérből, és bejut a sejtekbe, azon belül a mitokondriumokba. Ezeknek két membránjuk van, és a belső mélyen redőzött – ezek a kriszták adják a hatalmas munkafelületet. A glükóz lebontásából származó elektronok a redőkbe ágyazott négy fehérjekomplexen haladnak végig. Minden lépésnél protonokat pumpálnak ki a két membrán közé, így ott feltorlódik a töltés, mint egy víztározóban. A protonok aztán az ATP-szintázon zúdulnak vissza, és ez hajtja meg az ATP gyártását. Az oxigén a negyedik komplexnél lép be: nem éget semmit, hanem felveszi az elhasznált elektronokat, és vízzé alakul. Ha nincs ott, az egész sor visszatorlódik és megáll.",
 sci:"Az oxigénszegény, savasabb szöveti környezet segít is: a hemoglobin itt lazábban tartja az oxigént, és bőségesen leadja. A vörösvértest maga viszont különös kivétel – nincs mitokondriuma, tehát abból az oxigénből, amit szállít, semmit sem fogyaszt el.",
 tie:"Innen érthető a tummo és a Wim Hof légzés hatása is: a felfokozott anyagcsere és az adrenalin-válasz miatt melegedsz fel, nem attól, hogy több oxigént vittél be.",
 sl:["ATP egy glükózból","a lánc utolsó láncszeme","a folyamat mellékterméke"],exs:["tummo","wimhof"],
 d:["H⁺ vissza","O₂ + 4H⁺ → H₂O","citrátkör","NADH → I. komplex","glükóz","belső membrán redői (kriszták)","külső","membrán"]},
{name:"A szén-dioxid útja vissza",phase:"CO₂ visszaút",tag:"Három formában utazik, nem egyben",
 short:"A CO₂ nagy része nem gázként, hanem bikarbonátként megy vissza.",
 cap:"A vörösvértest belseje: a karboanhidráz szénsavvá alakítja a CO₂-t, a bikarbonát kicserélődik kloridra, a hidrogéniont pedig a hemoglobin fogja meg.",
 what:"A szén-dioxid a sejtekből a vérbe lép, és nagy része azonnal bediffundál a vörösvértestekbe. Ott egy nagyon gyors enzim, a karboanhidráz vízzel szénsavvá alakítja, ami rögtön szét is esik hidrogénionra és bikarbonátra. A hidrogéniont a hemoglobin fogja meg, hogy ne savasodjon el a vér, a bikarbonát pedig kilép a plazmába – a helyére a membrán cserélőjén át egy klorid lép be, hogy az elektromos egyensúly megmaradjon. Így a CO₂ mintegy 70%-a bikarbonátként utazik, körülbelül 23%-a a hemoglobin fehérjerészéhez kötve, és csak 7% marad szabadon oldva. A tüdőben ugyanez a folyamat visszafelé pörög le.",
 sci:"Ez a rendszer egyben a szervezet legfontosabb pH-pufferének motorja. Ha gyorsan és mélyen lélegzel, több CO₂-t fújsz ki, mint amennyi termelődik: a vér lúgosabbá válik, és fellép a bizsergés, szédülés, kézgörcs. Ha viszont visszatartod a levegőt, a CO₂ felgyűlik – és a légzésingert elsősorban éppen ez váltja ki, nem az oxigénhiány.",
 tie:"Ez a kulcs a doboz légzéshez és a 4-7-8-hoz is: a visszatartás szándékosan hagy egy kis CO₂-t felgyűlni, ami lassítja a pulzust. A tűzlégzés és a Wim Hof-módszer az ellenkező irányba tolja el ugyanezt.",
 sl:["bikarbonátként","hemoglobinhoz kötve","oldott gázként"],exs:["box","n478","wimhof"],
 d:["a szövetből","karboanhidráz","Hb megköti","ki","be","kloridcsere","a CO₂ megoszlása","Hb-hoz kötve","oldott gáz","a tüdőben ez az egész","visszafelé játszódik le","vörösvértest belseje"]},
{name:"Vissza a tüdőbe",phase:"CO₂ visszaút",tag:"A két kör, ami egymásba kapcsolódik",
 short:"A CO₂-ban dús vér a jobb szívfélen át tér vissza a léghólyagokhoz.",
 cap:"A teljes keringés egyben. A kis kör a tüdőé, a nagy kör a testé – a kettő a szívben van sorba kapcsolva.",
 what:"A szén-dioxidban dús vér a nagy visszerekben a jobb pitvarba, onnan a jobb kamrába jut. Az egyetlen verőér a testben, ami oxigénszegény vért szállít, éppen a tüdőverőér – a rajzon a lila ág, ami a szívtől a tüdő felé indul. A léghólyagoknál a bikarbonátból visszaalakul a CO₂, kilép a levegőbe, a hemoglobin pedig újratölt oxigénnel, és a rózsaszín tüdővénákon tér vissza a bal szívfélbe. Innen indul a nagy vérkör. A két kör sorba van kapcsolva, tehát ugyanannyi vér megy át rajtuk – csak nagyon eltérő nyomással.",
 sci:"A tüdőkör azért működhet alacsony nyomáson, mert rövid és tág: így a hajszálerek fala vékony maradhat, ami a gázcsere feltétele. Ha ez a nyomás tartósan megemelkedik – tüdőmagasvérnyomásban –, a jobb kamra túlterhelődik.",
 tie:"A mély, lassú légzés a rekeszizom mozgatásával szó szerint pumpálja a vénás vért a szív felé: belégzésnél a csökkenő mellkasi nyomás beszívja, kilégzésnél a növekvő nyomás továbbnyomja.",
 sl:["akkora nyomás, mint a testkörben","tüdőartériás középnyomás","egy teljes körút"],exs:["belly","koherens"],
 d:["TÜDŐ","jobb","bal","SZÍV","tüdőverőér · CO₂-dús","tüdővéna · O₂-dús","szövetek hajszálerei","aorta","nagy vénák","KIS VÉRKÖR","alacsony nyomás","NAGY VÉRKÖR","ötször nagyobb nyomás"]},
{name:"Kilégzés",phase:"Kilégzés",tag:"Nyugalomban nem is munka – csak visszarugózás",
 short:"A rekeszizom elernyed, a tüdő rugalmasan visszahúzódik, a levegő távozik.",
 cap:"Balra belégzés: a rekeszizom lelapul, a bordák felemelkednek. Jobbra kilégzés: minden visszaesik. Alul a pulzus hullámzása – ez a légzési szinuszaritmia.",
 what:"Belégzéskor a rekeszizom összehúzódik és lelapul, a bordák pedig felfelé és kifelé emelkednek, mint egy vödör füle – a mellkas így minden irányban tágul, a benti nyomás lecsökken, és a levegő beáramlik. Nyugalmi kilégzéskor viszont nem kell külön izommunka: a rekeszizom elernyed, kupola alakban visszaemelkedik, a bordák visszaesnek, a megfeszült tüdőszövet pedig egyszerűen visszarugózik. Így távozik a szén-dioxidban dús levegő ugyanazon az útvonalon: hörgőcskék, hörgők, légcső, orr. Erőteljes kilégzésnél – köhögésnél, tűzlégzésnél – a hasizmok is besegítenek.",
 sci:"A kilégzés az idegrendszer szempontjából a legfontosabb szakasz. A rajz alján a pulzusgörbe mutatja: a hosszú kilégzés alatt megnő a bolygóideg (nervus vagus) aktivitása, ami lassítja a szívverést; belégzésnél ez a fék enged, és a pulzus gyorsul. Ezt hívják légzési szinuszaritmiának, és minél kifejezettebb, annál jobb a szívritmus-variabilitásod. Emiatt erősebb a nyugtató hatás akkor, ha a kilégzés hosszabb, mint a belégzés.",
 tie:"Ez az egész app egyetlen mondatban: nem a mély belégzés nyugtat meg, hanem a lassú kilégzés. Ezért 4-7-8 és nem 8-7-4, és ezért tart a méhzümmögés kilégzése kétszer annyi ideig, mint a belégzés.",
 sl:["egy nyugalmi lélegzet","légvétel percenként","ennyi izommunka kell hozzá"],exs:["n478","bhramari","belly"],
 d:["BELÉGZÉS","rekeszizom lelapul, bordák ki-fel","KILÉGZÉS","elernyed, felboltozódik – passzív","pulzus","belégzés: gyorsul","kilégzés: lassul"]}
]};

 steps:["Stai sau întinde-te într-un loc sigur și comod.","30 de inspirații adânci și rapide în burtă și piept, cu expirații relaxate, nu complete.","Furnicături, ușoară amețeală sunt normale – de aceea niciodată în picioare.","După ultima expirație rămâi cu plămânii goi, cât ține confortabil (nu e concurs!).","Apoi inspiră adânc, ține 15 secunde, apoi eliberează."],
 warn:"NICIODATĂ în apă, în cadă, sub duș, la volan sau în picioare – pericol de leșin! În boli de inimă, epilepsie sau sarcină, renunță.",
 ph:[["Inspirație adâncă",""],["Expirație relaxată",""],["Ține după expirație","cât ține confortabil – poți respira oricând"],["Inspirație adâncă",""],["Ține aerul",""],["Eliberează",""]]}
},
map:[
{name:"Nasul",phase:"Inspirație",tag:"Filtru, încălzire, umidificare – și o fabrică de gaz",
 short:"Aerul se filtrează, se încălzește la temperatura corpului și se saturează cu umezeală.",
 cap:"Secțiune longitudinală a capului, din profil. Aerul intră din stânga, cele trei cornete nazale îl forțează în vârtej, apoi coboară spre faringe.",
 what:"Din peretele cavității nazale ies trei rafturi osoase, cornetele nazale – în desen cele trei limbi răsucite în sus. Ele forțează aerul să se învârtă, astfel încât acesta atinge o suprafață mult mai mare de mucoasă umedă și bine irigată. În câțiva centimetri aerul inspirat se încălzește la temperatura corpului, până la bronhiile principale devine practic saturat cu vapori, iar particulele mai mari rămân prinse în stratul de mucus. Dacă respiri pe gură, toată această pregătire lipsește, iar povara aerului mai uscat o duce mucoasa traheei.",
 sci:"Sinusurile paranazale – în desen cele trei cavități din frunte, din osul obrazului și din adâncul craniului – produc constant oxid nitric (NO), care la inspirație este dus în plămâni. NO dilată vasele și bronhiile, îmbunătățește potrivirea dintre ventilație și fluxul sanguin și are și efect antiviral și antibacterian. Măsurătorile arată că respirând pe nas, presiunea oxigenului măsurată la piele este cu circa 10% mai mare decât la respirația pe gură.",
 tie:"De aceea aproape toate tehnicile încep cu inspirația pe nas. Bâzâitul albinei ține aparte de aici: vibrația bâzâitului crește de multe ori cantitatea de NO care iese din sinusuri.",
 sl:["până aici se încălzește aerul","umiditate la bronhiile principale","din umezeală o adaugă nasul"],exs:["nadi","bhramari"],
 d:["cornete nazale (3)","praful și polenul rămân prinse","sinusuri","spre faringe","mucoasă","aer"]},
{name:"Laringe și trahee",phase:"Inspirație",tag:"Inele de cartilaj în formă de potcoavă și o scară rulantă de mucus",
 short:"Un tub de cca 11 cm, ținut deschis de inele de cartilaj, care se curăță singur pe dinăuntru.",
 cap:"În stânga traheea văzută din față, cu inelele de cartilaj și bifurcația; în dreapta peretele mărit: strat de mucus, cili, celule caliciforme.",
 what:"Trecând prin laringe, aerul ajunge în trahee: un tub de cca 10–12 cm, întins de inele de cartilaj în formă de potcoavă, deschise în spate. Nu sunt cercuri complete tocmai ca esofagul din spate să se poată lărgi când înghiți. Jos, la carină, traheea se împarte în două bronhii principale; cea dreaptă e mai groasă și pornește mai abrupt, de aceea acolo ajunge mai des un corp străin înghițit greșit. Interiorul traheei e căptușit cu epiteliu ciliat: milioane de firișoare microscopice împing un strat subțire de mucus în sus, spre gât. În detaliul mărit, celulele caliciforme dintre cili produc chiar mucusul.",
 sci:"Cilii bat coordonat, în valuri, iar mișcarea lor este reglată printre altele și de oxidul nitric produs în nas. Dacă aerul e prea uscat – de exemplu la respirația pe gură –, mucusul se îngroașă și scara rulantă încetinește. Fumul de țigară strică dovedit acest mecanism de curățare.",
 tie:"Ujjayi (respirația oceanului) îngustează ușor tocmai aici, la laringe – murmurul slab care apare e un feedback auditiv despre cât de uniform e fluxul tău de aer.",
 sl:["lungimea traheei","inele de cartilaj în potcoavă","de aici începe numerotarea căilor"],exs:["ujjayi"],
 d:["cili","strat de mucus","celule caliciforme","murdăria urcă","laringe","trahee","bronhia stângă","bronhia dreaptă","esofag","carină"]},
{name:"Bronhii și bronhiole",phase:"Inspirație",tag:"23 de ramificații, un copac întors cu capul în jos",
 short:"Tubul se împarte în două, apoi iar și iar – în total cca 23 de generații.",
 cap:"Conturul celor doi plămâni cu lobii, iar în interior arborele bronșic. Plămânul drept are 3 lobi, cel stâng 2 – în stânga trebuie făcut loc și inimii.",
 what:"Traheea se împarte în două bronhii principale, apoi fiecare ramură se împarte iar în două. Drumul mediu de la trahee până la marginea plămânului înseamnă cam 23 de astfel de ramificații, dar în realitate nu e regulat: se vede și în desen că ramurile au lungimi și grosimi diferite – asta se numește diviziune dihotomică neregulată. Primele 16 generații doar transportă, aici încă nu există schimb de gaze. De la a 17-a ramificație apar în perete primele alveole, iar de aici aerul curge tot mai lent, până când mișcarea e preluată de simpla difuzie.",
 sci:"La fiecare diviziune secțiunea totală a ramurilor crește, deci viteza aerului scade dramatic. Cele mai mici bronhiole nu mai au schelet cartilaginos, doar un inel de mușchi neted – acestea se strâng spasmodic în criza de astm. Volumul zonei conducătoare este spațiul mort: cca 150 ml, care la fiecare respirație se pierde din punctul de vedere al schimbului de gaze.",
 tie:"De aceea o respirație lentă și adâncă e mai eficientă decât două grăbite: spațiul mort e același, dar la o respirație mai mare se pierde proporțional mult mai puțin din ea.",
 sl:["generații de ramificare","doar transportă (zona conducătoare)","deja face și schimb de gaze"],exs:["belly","koherens"],
 d:["trahee","bronhii principale","bronhii lobare","aici începe schimbul de gaze","plămânul drept · 3 lobi","plămânul stâng · 2 lobi","locul inimii"]},
{name:"Alveolele",phase:"Schimb de gaze",tag:"Jumătate de teren de tenis, împăturit în pieptul tău",
 short:"Câteva sute de milioane de săculeți minusculi, țesuți de o rețea deasă de capilare.",
 cap:"În stânga un sac alveolar cu rețeaua de capilare și globulele roșii care înaintează. În dreapta secțiunea peretelui, strat cu strat.",
 what:"Ultimele ramuri se termină în ciorchini: acestea sunt alveolele. În desen sunt intenționat poligonale, pentru că în realitate nu sunt sfere – presate strâns una de alta, împart pereți ca de fagure. Fiecare are doar o cincime de milimetru și sunt câteva sute de milioane. Dacă le-ai întinde, suprafața lor ar acoperi jumătate de teren de tenis. Pe fiecare o înfășoară o rețea deasă de capilare, în care globulele roșii înaintează în șir indian. Secțiunea din dreapta arată cât de subțire e peretele despărțitor: dinspre aer un film de grăsime, o celulă epitelială plată, o membrană bazală comună, o celulă a peretelui vascular – și ești deja în sânge.",
 sci:"Interiorul alveolelor e acoperit de o substanță tensioactivă, surfactantul – el împiedică lipirea săculeților minusculi la expirație. În emfizem pereții se descompun și alveolele fuzionează în cavități mai puține și mai mari: suprafața scade drastic. În fibroza pulmonară, invers, peretele se îngroașă și trecerea gazelor încetinește.",
 tie:"Inspirația adâncă, abdominală deschide și lobii pulmonari inferiori – acolo rețeaua de capilare e cea mai deasă, deci acolo schimbul de gaze e cel mai eficient. Respirația superficială toracică ocolește în mare parte această zonă.",
 sl:["alveole în total","suprafață de schimb","peretele aer-sânge"],exs:["belly","koherens"],
 d:["aer","film de surfactant","celulă epitelială","membrană bazală","celulă a peretelui vascular","sânge + globulă roșie","0,5–1 µm întreg peretele","bronhiolă","alveole","rețea de capilare","sângele stă aici 0,75 s – schimbul se face în 0,25 s"]},
{name:"Schimbul de gaze",phase:"Schimb de gaze",tag:"Nicio pompă – doar diferență de presiune",
 short:"Oxigenul și dioxidul de carbon migrează singure, de la presiune mai mare spre mai mică.",
 cap:"Cele două laturi ale peretelui. O₂ (două bile legate) merge de la stânga la dreapta, CO₂ (trei bile) de la dreapta la stânga, fiecare pe panta sa de presiune.",
 what:"Aici nu există pompă și nici transport activ: fiecare gaz merge de unde presiunea sa e mai mare spre unde e mai mică. În alveolă presiunea oxigenului e cca 100 mmHg, în sângele care sosește doar 40 – această diferență de șaizeci împinge oxigenul înăuntru, unde în globula roșie îl preia imediat hemoglobina. La dioxidul de carbon diferența e doar de 5 mmHg, însă CO₂ se dizolvă și trece prin perete de circa douăzeci de ori mai repede, deci și această pantă mică e mai mult decât suficientă.",
 sci:"În repaus globula roșie petrece cca 0,75 secunde în capilar, dar echilibrarea se face deja la o treime din drum – deci există o rezervă de siguranță de trei ori. De aceea nu difuzia, ci fluxul sanguin este gâtul de sticlă: asta se numește schimb limitat de perfuzie.",
 tie:"De aici se vede de ce respirația grăbită nu rezolvă nimic: sângele oricum se saturează. Ce îmbunătățește respirația lentă este potrivirea mai bună dintre ventilație și fluxul sanguin în tot plămânul.",
 sl:["panta de presiune O₂, mmHg","panta de presiune CO₂, mmHg","în care se echilibrează"],exs:["koherens","box"],
 d:["ALVEOLĂ","CAPILAR","perete","hemoglobina îl preia","în aerul expirat"]},
{name:"Sângele și hemoglobina",phase:"Transport O₂",tag:"Patru atomi de fier, patru locuri pentru oxigen",
 short:"Oxigenul se dizolvă prost în sânge – de aceea urcă într-un taxi, hemoglobina.",
 cap:"În stânga forma de disc a globulei roșii cu mijlocul înfundat, iar înăuntru cele patru subunități ale hemoglobinei. În dreapta curba de saturație: forma de S e semnul legării cooperative.",
 what:"Oxigenul se dizolvă prost în apă, deci în plasmă abia încape ceva din el. Soluția e hemoglobina: o proteină din patru subunități din interiorul globulelor roșii – două lanțuri alfa și două beta –, fiecare cu un disc plat de hem în mijloc, în inima căruia stă un atom de fier. Un fier leagă o moleculă de oxigen, deci o hemoglobină transportă patru. 98,5% din oxigenul transportat călătorește așa, doar 1,5% se dizolvă liber în plasmă. Globula roșie nu are nucleu și e turtită la mijloc tocmai ca să încapă cât mai multă hemoglobină.",
 sci:"Legarea nu e uniformă: cum se leagă primul oxigen, proteina își schimbă forma și îl primește mai ușor pe al doilea și al treilea. Aceasta e legarea cooperativă, și de aici forma de S a curbei de saturație din dreapta. Partea de sus, plată, e plămânul: aici nici o scădere mare de presiune nu reduce mult saturația. Partea abruptă din mijloc e țesutul: aici o mică scădere de presiune eliberează foarte mult oxigen. Într-un mediu mai acid, mai cald, mai bogat în CO₂ curba se deplasează la dreapta – acesta e efectul Bohr.",
 tie:"Asta explică de ce hiperventilația nu ajută: vârful curbei e plat, sângele tău în repaus e deja la 97–99%. Ce se schimbă cu adevărat la respirația rapidă este nivelul de dioxid de carbon.",
 sl:["O₂ pe o hemoglobină","legat de hemoglobină","în care se saturează celula"],exs:["wimhof","koherens"],
 d:["moleculă de O₂","hem + atom de fier","globulă roșie · 4 locuri","saturație","țesut","plămân","presiunea O₂ →","zona abruptă:","aici cedează O₂"]},
{name:"Inima și arterele",phase:"Transport O₂",tag:"Partea stângă a inimii: pompa de înaltă presiune",
 short:"Sângele bogat în oxigen care se întoarce din plămâni pornește spre corp prin partea stângă.",
 cap:"Cele patru camere ale inimii în secțiune. Mov e partea bogată în CO₂, roz cea bogată în oxigen; liniile scurte sunt valvele.",
 what:"Sângele proaspăt oxigenat ajunge prin venele pulmonare în atriul stâng, de acolo prin valvă în ventriculul stâng, cea mai puternică pompă musculară a corpului – în desen se vede clar că peretele lui e mult mai gros decât cel din dreapta. De aici pornește în aortă, apoi prin artere tot mai mici până la capilare. Partea dreaptă mișcă aceeași cantitate de sânge, dar doar până la plămâni, cu o presiune mult mai mică. În repaus inima mișcă în jur de cinci litri de sânge pe minut, iar traseul complet al unei globule roșii durează mai puțin de un minut.",
 sci:"Circulația pulmonară și cea sistemică sunt legate în serie, deci cele două jumătăți ale inimii mișcă aceeași cantitate de sânge, doar la presiuni foarte diferite. La inspirație presiunea scăzută din torace trage mai mult sânge înapoi spre inimă – de aceea pulsul se accelerează la inspirație și încetinește la expirație.",
 tie:"Această ondulație a pulsului e aritmia sinusală respiratorie, baza variabilității ritmului cardiac. De aceea efectul respirației lente e măsurabil direct pe inimă.",
 sl:["debit cardiac în repaus","un traseu complet","presiunea arterială a O₂"],exs:["koherens","box"],
 d:["dreapta","stânga","atriu","vena cavă superioară","vena cavă inferioară","artera pulmonară","AORTA","vene pulmonare","țesuturi, capilare","ventricul","~5 l/min","debit cardiac în repaus","peretele ventriculului stâng","e de trei ori mai gros"]},
{name:"Celula și mitocondria",phase:"Celulă",tag:"Capătul drumului: aici aerul devine energie",
 short:"Oxigenul închide lanțul producător de energie în centralele celulei.",
 cap:"Secțiune printr-o mitocondrie. Pe pliurile membranei interne stau cele patru complexe și ATP-sintaza; protonii sunt pompați afară, apoi năvălesc înapoi prin ATP-sintază.",
 what:"În capilare oxigenul iese din sânge și intră în celule, iar în interiorul lor în mitocondrii. Acestea au două membrane, iar cea internă e adânc pliată – aceste criste dau suprafața uriașă de lucru. Electronii proveniți din descompunerea glucozei parcurg patru complexe proteice înfipte în pliuri. La fiecare pas pompează protoni între cele două membrane, unde sarcina se acumulează ca într-un baraj. Protonii năvălesc apoi înapoi prin ATP-sintază, iar asta acționează producția de ATP. Oxigenul intră la al patrulea complex: nu arde nimic, ci preia electronii uzați și devine apă. Dacă lipsește, tot șirul se blochează și se oprește.",
 sci:"Mediul tisular sărac în oxigen și mai acid ajută și el: hemoglobina ține aici oxigenul mai lejer și îl cedează din belșug. Globula roșie însă e o excepție curioasă – nu are mitocondrii, deci din oxigenul pe care îl transportă nu consumă nimic.",
 tie:"De aici se înțelege și efectul respirației tummo și Wim Hof: te încălzești din cauza metabolismului accelerat și a răspunsului adrenalinic, nu pentru că ai introdus mai mult oxigen.",
 sl:["ATP dintr-o glucoză","ultima verigă a lanțului","produsul secundar al procesului"],exs:["tummo","wimhof"],
 d:["H⁺ înapoi","O₂ + 4H⁺ → H₂O","ciclul Krebs","NADH → complexul I","glucoză","pliurile membranei interne (criste)","membrana","externă"]},
{name:"Drumul de întoarcere al CO₂",phase:"Întoarcerea CO₂",tag:"Călătorește în trei forme, nu în una",
 short:"Cea mai mare parte a CO₂ se întoarce nu ca gaz, ci sub formă de bicarbonat.",
 cap:"Interiorul globulei roșii: anhidraza carbonică transformă CO₂ în acid carbonic, bicarbonatul se schimbă pe clor, iar ionul de hidrogen e prins de hemoglobină.",
 what:"Dioxidul de carbon trece din celule în sânge, iar cea mai mare parte difuzează imediat în globulele roșii. Acolo o enzimă foarte rapidă, anhidraza carbonică, îl transformă cu apă în acid carbonic, care se descompune imediat în ion de hidrogen și bicarbonat. Ionul de hidrogen e prins de hemoglobină, ca sângele să nu se acidifieze, iar bicarbonatul iese în plasmă – în locul lui intră un clor prin schimbătorul din membrană, ca echilibrul electric să se păstreze. Astfel cca 70% din CO₂ călătorește ca bicarbonat, circa 23% legat de partea proteică a hemoglobinei, și doar 7% rămâne dizolvat liber. În plămâni același proces se desfășoară invers.",
 sci:"Acest sistem este totodată motorul celui mai important tampon de pH al organismului. Dacă respiri repede și adânc, expiri mai mult CO₂ decât se produce: sângele devine mai alcalin și apar furnicături, amețeală, crampe la mâini. Dacă însă ții aerul, CO₂ se acumulează – iar impulsul de a respira e declanșat în primul rând de asta, nu de lipsa oxigenului.",
 tie:"Aceasta e cheia și pentru respirația în cutie și pentru 4-7-8: reținerea lasă intenționat să se acumuleze puțin CO₂, care încetinește pulsul. Respirația focului și metoda Wim Hof împing același lucru în direcția opusă.",
 sl:["ca bicarbonat","legat de hemoglobină","ca gaz dizolvat"],exs:["box","n478","wimhof"],
 d:["din țesut","anhidrază carbonică","Hb îl leagă","iese","intră","schimb de clor","distribuția CO₂","legat de Hb","gaz dizolvat","în plămâni totul","se desfășoară invers","interiorul globulei roșii"]},
{name:"Înapoi în plămâni",phase:"Întoarcerea CO₂",tag:"Cele două circuite care se leagă unul de altul",
 short:"Sângele bogat în CO₂ se întoarce la alveole prin partea dreaptă a inimii.",
 cap:"Întreaga circulație într-o singură imagine. Circuitul mic e al plămânilor, cel mare al corpului – cele două sunt legate în serie în inimă.",
 what:"Sângele bogat în dioxid de carbon ajunge prin venele mari în atriul drept, de acolo în ventriculul drept. Singura arteră din corp care transportă sânge sărac în oxigen este chiar artera pulmonară – în desen ramura mov care pornește de la inimă spre plămâni. La alveole bicarbonatul se transformă înapoi în CO₂, iese în aer, iar hemoglobina se reîncarcă cu oxigen și se întoarce prin venele pulmonare roz în partea stângă a inimii. De aici pornește circuitul mare. Cele două circuite sunt legate în serie, deci prin ele trece aceeași cantitate de sânge – doar cu presiuni foarte diferite.",
 sci:"Circuitul pulmonar poate funcționa la presiune joasă pentru că e scurt și larg: astfel peretele capilarelor poate rămâne subțire, ceea ce e condiția schimbului de gaze. Dacă această presiune crește durabil – în hipertensiunea pulmonară –, ventriculul drept se suprasolicită.",
 tie:"Respirația adâncă și lentă pompează literalmente sângele venos spre inimă prin mișcarea diafragmei: la inspirație presiunea toracică scăzută îl trage înăuntru, la expirație presiunea crescută îl împinge mai departe.",
 sl:["din presiunea circuitului sistemic","presiunea medie în artera pulmonară","un traseu complet"],exs:["belly","koherens"],
 d:["PLĂMÂNI","dreapta","stânga","INIMA","artera pulmonară · bogat în CO₂","vena pulmonară · bogat în O₂","capilarele țesuturilor","aortă","vene mari","CIRCUITUL MIC","presiune joasă","CIRCUITUL MARE","presiune de cinci ori mai mare"]},
{name:"Expirația",phase:"Expirație",tag:"În repaus nici măcar nu e muncă – doar revenire elastică",
 short:"Diafragma se relaxează, plămânul se retrage elastic, aerul iese.",
 cap:"În stânga inspirația: diafragma se aplatizează, coastele se ridică. În dreapta expirația: totul recade. Jos ondulația pulsului – aceasta e aritmia sinusală respiratorie.",
 what:"La inspirație diafragma se contractă și se aplatizează, iar coastele se ridică în sus și în afară, ca toarta unei găleți – toracele se lărgește astfel în toate direcțiile, presiunea din interior scade și aerul intră. La expirația de repaus însă nu e nevoie de muncă musculară separată: diafragma se relaxează, se ridică înapoi în formă de cupolă, coastele recad, iar țesutul pulmonar întins pur și simplu revine elastic. Așa iese aerul bogat în dioxid de carbon pe același traseu: bronhiole, bronhii, trahee, nas. La expirația forțată – la tuse, la respirația focului – ajută și mușchii abdominali.",
 sci:"Din punctul de vedere al sistemului nervos, expirația e faza cea mai importantă. Curba pulsului din partea de jos a desenului arată: în timpul expirației lungi crește activitatea nervului vag, care încetinește bătăile inimii; la inspirație frâna slăbește și pulsul se accelerează. Aceasta se numește aritmie sinusală respiratorie, și cu cât e mai pronunțată, cu atât variabilitatea ritmului tău cardiac e mai bună. De aceea efectul de calmare e mai puternic când expirația e mai lungă decât inspirația.",
 tie:"Toată aplicația într-o singură propoziție: nu inspirația adâncă te calmează, ci expirația lentă. De aceea 4-7-8 și nu 8-7-4, și de aceea expirația la bâzâitul albinei durează de două ori mai mult decât inspirația.",
 sl:["o respirație de repaus","respirații pe minut","muncă musculară necesară"],exs:["n478","bhramari","belly"],
 d:["INSPIRAȚIE","diafragma coboară, coastele urcă","EXPIRAȚIE","se relaxează, se boltește – pasiv","puls","inspirație: accelerează","expirație: încetinește"]}
]};

ex:{
box:{name:"Box-Atmung",eyebrow:"Yoga (Sama Vritti) · auch von Navy SEALs genutzt",
 desc:"Die am besten erforschte Beruhigungstechnik: vier gleiche Abschnitte zu je 4 Sekunden, wie die vier Seiten eines Quadrats. Während des Anhaltens sammelt sich vorübergehend Kohlendioxid im Blut – das verlangsamt den Herzschlag und schaltet das parasympathische (Ruhe- und Verdauungs-)Nervensystem ein.",
 daily:"2–3 mal täglich, jeweils 4–6 Runden (2–3 Minuten) – und zusätzlich sofort, wenn dich Stress trifft.",
 effects:"Senkt Cortisol (das Stresshormon) und den Blutdruck, verbessert Konzentration und Stimmung, hilft bei Panik, Angst und Schlaflosigkeit.",
 steps:["Sitze mit geradem Rücken, die Füße auf dem Boden, die Hände locker im Schoß.","Atme alle Luft langsam durch den Mund aus.","4 Sekunden durch die Nase einatmen – in den Bauch, nicht in die Brust.","4 Sekunden halten.","4 Sekunden langsam ausatmen.","4 Sekunden mit leerer Lunge bleiben, dann von vorn beginnen."],
 warn:"Wenn 4 Sekunden zu viel sind, beginne mit 2–3 Sekunden – es wirkt genauso.",
 ph:[["Durch die Nase einatmen",""],["Halten",""],["Ausatmen",""],["Leer bleiben",""]]},
n478:{name:"4-7-8-Atmung",eyebrow:"Dr. Andrew Weil · auf Pranayama-Grundlage",
 desc:"Das natürliche Beruhigungsmittel des Nervensystems – das Geheimnis ist die lange, 8 Sekunden dauernde Ausatmung, die das Ruhenervensystem stark aktiviert. Zum Einschlafen eine der wirksamsten Übungen.",
 daily:"2 mal täglich: nach dem Aufwachen und vor dem Zubettgehen. Anfangs höchstens 4 Runden, nach einigen Wochen bis zu 8.",
 effects:"Senkt nachweislich Angst und Blutdruck, hilft beim Einschlafen und kann auch das Schmerzempfinden dämpfen.",
 steps:["Sitze mit geradem Rücken (anfangs nicht im Stehen – dir kann schwindelig werden).","Lege die Zungenspitze hinter die oberen Zähne an den Gaumen und lasse sie dort.","Atme alle Luft mit leisem Zischen durch den Mund aus.","4 Sekunden bei geschlossenem Mund durch die Nase einatmen.","7 Sekunden halten.","8 Sekunden durch den Mund ausatmen."],
 warn:"In den ersten Wochen ist leichter Schwindel normal – übe im Sitzen.",
 ph:[["Durch die Nase einatmen","Zunge hinter den oberen Zähnen"],["Halten",""],["Durch den Mund ausatmen","langsam, zischend"]]},
belly:{name:"Bauchatmung",eyebrow:"Zwerchfellatmung · Grundlage aller Techniken",
 desc:"Die Grundlage der Tiefenatmung: Du atmest mit dem Zwerchfell (dem kuppelförmigen Muskel unter der Lunge), nicht mit dem Brustkorb. Wenn sich dein Bauch hebt und nicht die Brust, machst du es richtig.",
 daily:"Zum Lernen 1–2 mal täglich 5–10 Minuten; wenn es sitzt, jederzeit unauffällig – auch an der Maschine.",
 effects:"Senkt Stress und Blutdruck, verbessert die Verdauung, stärkt das Zwerchfell und die Rumpfstabilität. Bei COPD und Asthma eine Basisübung.",
 steps:["Sitze oder lege dich bequem hin, eine Hand auf der Brust, die andere auf dem Bauch.","Atme eine Minute normal und beobachte: Welche Hand bewegt sich?","4 Sekunden langsam durch die Nase einatmen, sodass sich die Hand auf dem Bauch hebt.","6 Sekunden langsam mit leicht gespitzten Lippen ausatmen, als würdest du eine Kerze anblasen.","Übe täglich 5–10 Minuten, bis es natürlich wird."],
 warn:"Du kannst sie auch bei körperlicher Arbeit im Stehen nutzen – niemand sieht, dass du übst.",
 ph:[["In den Bauch einatmen","die Hand auf dem Bauch hebt sich"],["Langsam ausatmen","mit Lippenbremse, wie beim Kerzenpusten"]]},
koherens:{name:"Kohärente Atmung",eyebrow:"Resonanzatmung · etwa 5–6 Atemzüge pro Minute",
 desc:"Du verlangsamst deine Atmung auf etwa 5-6 Atemzüge pro Minute – das ist die Resonanzfrequenz des Herz-Kreislauf-Systems. In diesem Takt erreicht die Herzratenvariabilität (die Schwankung zwischen den Herzschlägen, der Hauptindikator für Stressresistenz) ihr Maximum.",
 daily:"Ideal 10–20 Minuten täglich, am Stück oder verteilt. Auch gegen das Nachmittagstief nach dem Essen hervorragend.",
 effects:"Verbessert nachweislich die Herzratenvariabilität, senkt Blutdruck, Angst und depressive Symptome. Ohne Atemanhalten, deshalb die sicherste Technik.",
 steps:["Sitze oder lege dich bequem hin, atme durch die Nase.","Etwa 5-6 Sekunden langsam in den Bauch einatmen.","Genauso langsam ausatmen – ohne Anstrengung und ohne Pause.","Die Atmung soll leicht und leise sein, wie eine Welle.","Fahre 10–20 Minuten fort."],
 warn:"Praktisch für jeden geeignet. Wenn 5,5 Sekunden zu viel sind, geht es auch mit 4,5.",
 ph:[["Einatmen","langsam, in den Bauch"],["Ausatmen","ohne Anstrengung"]]},
nadi:{name:"Wechselatmung",eyebrow:"Yoga-Pranayama · die Reinigung der Kanäle",
 desc:"Klassische Yogaübung: Du atmest abwechselnd durch die beiden Nasenlöcher. Im Yoga heißt es, sie gleiche die beiden Gehirnhälften aus; physiologisch ist es langsame, bewusste Nasenatmung, die tief beruhigt.",
 daily:"1–2 mal täglich 5–10 Runden, auf nüchternen Magen (2–3 Stunden nach dem Essen). Morgens klärt sie, abends macht sie müde.",
 effects:"Beruhigt das Nervensystem, senkt Stress, verbessert Lungenkapazität und Sauerstoffversorgung des Blutes und reguliert langfristig auch den Blutdruck.",
 steps:["Sitze mit geradem Rücken, auf nüchternen Magen.","Rechte Hand: Daumen ans rechte Nasenloch, Ringfinger ans linke – nur sanft berühren.","Schließe das rechte Nasenloch, atme 4 Sekunden links ein.","Schließe beide, halte 4 Sekunden.","Öffne rechts, atme 4 Sekunden dort aus.","Atme dort wieder ein, halte, dann links ausatmen – das ist eine ganze Runde."],
 warn:"Bei Schnupfen oder einer Nasen- bzw. Racheninfektion nicht ausführen.",
 ph:[["Links einatmen","rechtes Nasenloch mit dem Daumen zu"],["Halten","beide Nasenlöcher zu"],["Rechts ausatmen","links mit dem Ringfinger zu"],["Rechts einatmen","links bleibt zu"],["Halten","beide Nasenlöcher zu"],["Links ausatmen","rechts zu"]]},
ujjayi:{name:"Ujjayi – Ozeanatmung",eyebrow:"Yoga-Pranayama · die Grundatmung der Yogapraxis",
 desc:"Durch leichtes Verengen der Kehle gibst du dem Atem einen leisen Klang wie Meeresrauschen. Der Klang ist hörbare Rückmeldung: Ist er gleichmäßig, ist es auch dein Atem.",
 daily:"Während Bewegung oder Yoga durchgehend; zur Konzentration tagsüber 3–5 Minuten. Keine tägliche Obergrenze.",
 effects:"Verbessert die Konzentration, beruhigt auch in Bewegung, verlangsamt und vertieft die Atmung.",
 steps:["Atme durch die Nase, mit geschlossenem Mund.","Verenge die Kehle ein wenig – als wolltest du mit geschlossenem Mund einen Spiegel beschlagen.","So strömt die Luft mit leisem Rauschen ein und aus.","Einatmen etwa 5 Sekunden, Ausatmen etwa 5 Sekunden, gleichmäßig.","Bricht der Klang ab, werde langsamer – der Klang ist dein Führer."],
 warn:"Das Rauschen soll leise sein, nur du sollst es hören – überanstrenge die Kehle nicht.",
 ph:[["Einatmen – leises Rauschen","Kehle leicht verengt"],["Ausatmen – leises Rauschen","gleichmäßig, durch die Nase"]]},
bhramari:{name:"Bienensummen",eyebrow:"Yoga-Pranayama · das am schnellsten wirkende Beruhigungsmittel",
 desc:"Beim Ausatmen summst du mit geschlossenem Mund einen tiefen Ton wie eine Biene. Die Vibration ist im ganzen Schädel spürbar – eine der am schnellsten wirkenden Beruhigungsübungen.",
 daily:"1–2 mal täglich, jeweils 5–7 Summtöne. Vor dem Einschlafen am wirksamsten.",
 effects:"Senkt sofort Anspannung und Puls, laut Studien auch den Blutdruck. Das Summen erhöht die Stickstoffmonoxid-Abgabe aus den Nasennebenhöhlen um ein Vielfaches.",
 steps:["Sitze mit geschlossenen Augen an einem ruhigen Ort.","Verschließe mit den Zeigefingern sanft die Ohren am Knorpel.","4 Sekunden durch die Nase einatmen.","Beim Ausatmen mit geschlossenem Mund tief summen, so lange es angenehm ist.","Beobachte die Vibration im Kopf und im Brustkorb."],
 warn:"Bei einer Ohrentzündung die Ohren nicht verschließen – es funktioniert auch ohne.",
 ph:[["Durch die Nase einatmen","Ohren sanft verschlossen"],["Summendes Ausatmen","mit geschlossenem Mund, spüre die Vibration"]]},
kapalabhati:{name:"Kapalabhati – Feueratem",eyebrow:"Yoga-Reinigungsübung · leuchtender Schädel",
 desc:"Belebende Reinigungsübung: Das Ausatmen ist schnell und kraftvoll, mit einem Einziehen der Bauchmuskeln, das Einatmen geschieht von selbst, passiv. Wie ein Kaffee – nur aus Atem.",
 daily:"1 mal täglich, als Anfänger 3 Serien à 20 Stöße, auf nüchternen Magen. Nachmittags und abends nicht mehr – es putscht auf.",
 effects:"Belebt und weckt, bewegt Bauchmuskeln und Zwerchfell, reinigt die Nasenwege, regt die Verdauung an.",
 steps:["Sitze mit geradem Rücken, auf nüchternen Magen, die Hände auf den Knien.","Nimm einen tiefen Atemzug.","Kraftvoll und schnell durch die Nase ausatmen, mit ruckartigem Einziehen des Bauches – etwa ein Stoß pro Sekunde.","Kümmere dich nicht ums Einatmen: Es geschieht von selbst, wenn der Bauch loslässt.","Nach 20 Stößen tief einatmen, langsam ausatmen, ein paar Atemzüge ruhen."],
 warn:"VERBOTEN in der Schwangerschaft, bei Bluthochdruck, Herzkrankheit, Epilepsie, Bruch oder nach frischer Bauchoperation. Bei Schwindel sofort aufhören.",
 ph:[["Kräftiges Ausatmen","Bauch eingezogen"],["Passives Einatmen","der Bauch lässt los"],["Tief einatmen",""],["Langsam ausatmen",""],["Pause","atme natürlich"]]},
tummo:{name:"Tummo – inneres Feuer",eyebrow:"Tibetische Mönche · die sechs Yogas des Naropa, 8. Jh.",
 desc:"Die Praxis des inneren Feuers der Himalaya-Mönche: kraftvolle Bauchatmung plus die Vorstellung einer Flamme hinter dem Nabel. Harvard-Forscher (Benson, 1982) maßen, dass geübte Mönche die Temperatur ihrer Gliedmaßen um bis zu 8 °C anheben können.",
 daily:"1 mal täglich, 3 Runden, nach dem Aufwachen auf nüchternen Magen. Abends meiden – es putscht auf.",
 effects:"Energetisiert und wärmt (aktiviert auch das braune Fettgewebe), verbessert die Kältetoleranz, führt in einen tiefen meditativen Zustand.",
 steps:["Sitze bequem mit geradem Rücken, die Hände auf dem Bauch. Dies ist die vereinfachte, weltliche Variante.","Stelle dir eine kleine Flamme hinter dem Nabel vor, die mit jedem Atemzug stärker wird.","Tief und schnell durch die Nase in den Bauch einatmen, dann kraftvoll durch den Mund ausatmen.","Wiederhole das 15 mal in diesem Rhythmus.","Bleibe nach der letzten Ausatmung mit leerer Lunge, so lange es angenehm ist.","Tief einatmen, 4–5 Sekunden halten, dann langsam ausatmen."],
 warn:"NIEMALS im Wasser, beim Autofahren oder im Stehen – das Atemanhalten kann zur Ohnmacht führen. Bei Herzkrankheit, Epilepsie oder Schwangerschaft weglassen.",
 ph:[["Schnell in den Bauch einatmen","die Flamme am Nabel wird stärker"],["Kräftiges Ausatmen",""],["Mit leerer Lunge bleiben","so lange es angenehm ist – notfalls atme"],["Tief einatmen",""],["Halten – die Wärme breitet sich aus",""],["Langsam ausatmen",""]]},
wimhof:{name:"Wim-Hof-Atmung",eyebrow:"Wim Hof · die weltliche Variante des Tummo",
 desc:"30 tiefe, rhythmische Atemzüge (eine leichte absichtliche Überatmung), dann Anhalten nach dem Ausatmen und zum Schluss ein 15 Sekunden langes Halten nach dem Einatmen. In einem Experiment zeigte sich, dass Praktizierende ihre Immunantwort beeinflussen konnten.",
 daily:"1 mal täglich, 3–4 Runden, nach dem Aufwachen auf nüchternen Magen – immer im Sitzen oder Liegen.",
 effects:"Energie- und Fokusschub, bessere Stressresistenz, erforschte immunmodulierende und entzündungshemmende Wirkung.",
 steps:["Setze oder lege dich an einen sicheren, bequemen Ort.","30 tiefe, schnelle Atemzüge in Bauch und Brust, mit lockeren, nicht vollständigen Ausatmungen.","Kribbeln und leichter Schwindel sind normal – deshalb niemals im Stehen.","Bleibe nach der letzten Ausatmung mit leerer Lunge, so lange es angenehm ist (kein Wettbewerb!).","Danach tief einatmen, 15 Sekunden halten, dann loslassen."],
 warn:"NIEMALS im Wasser, in der Badewanne, unter der Dusche, beim Autofahren oder im Stehen – Ohnmachtsgefahr! Bei Herzkrankheit, Epilepsie oder Schwangerschaft weglassen.",
